# Configuración de la aplicación Idóneos Online
spring.application.name=idoneos

# Base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/idoneos
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=laza

# Configuración JPA — update: crea tablas si no existen, no borra datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configuración del servidor Web
server.port=8080
server.error.path=/error