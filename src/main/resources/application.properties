# Configuración de la aplicación Idóneos Online
spring.application.name=idoneos

# Base de datos H2 en memoria (modo compatibilidad PostgreSQL) para pruebas locales inmediatas
spring.datasource.url=jdbc:h2:mem:idoneos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Configuración JPA (Recrea el esquema completo automáticamente al iniciar)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Configuración del servidor Web
server.port=8080
server.error.path=/error