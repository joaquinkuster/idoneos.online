# Configuración de la aplicación Idóneos Online
spring.application.name=idoneos

# Base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/idoneos
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=laza

# Configuración JPA — update: crea tablas si no existen, no borra datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Configuración de Google OAuth 2.0 (PA-1) via Variables de Entorno / Seguro
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:1064677657489-qsrsevkss4em8p70alhsicad3oc0bhmb.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-secret-placeholder}
spring.security.oauth2.client.registration.google.scope=email,profile

# Configuración del servidor Web
server.port=8080
server.error.path=/error