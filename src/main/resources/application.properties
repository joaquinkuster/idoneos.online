# Configuración de la aplicación Idóneos Online
spring.application.name=idoneos

# Cargar perfil local seguro (ignorado por.gitignore)
spring.profiles.include=local

# Base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/idoneos.online
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# Datos de demostración (usuarios, cursos, etc.): true en desarrollo. En un entorno real debe estar en false
idoneos.semilla=true

# Configuración JPA — update: aplica migraciones incrementales sin destruir datos
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Las asociaciones del modelo son EAGER: sin límite, un findById arma una consulta con decenas de uniones que tarda segundos. Con 2 niveles, lo más profundo se carga con consultas simples.
spring.jpa.properties.hibernate.max_fetch_depth=2
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Scripts de la carpeta schema (reglas de la base, una por entidad): se ejecutan después de que Hibernate crea las tablas.
# Primero los de util/, en este orden porque unos usan funciones de otros. Después uno por entidad.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema/util/MensajeErrorUtil.sql,classpath:schema/util/DuracionUtil.sql,classpath:schema/util/IntegridadUtil.sql,classpath:schema/util/ParametroUtil.sql,classpath:schema/util/PublicacionUtil.sql,classpath:schema/util/RecursoUtil.sql,classpath:schema/util/ProgramaUtil.sql,classpath:schema/util/EvaluacionUtil.sql,classpath:schema/*.sql
spring.sql.init.separator=^^^
spring.sql.init.encoding=UTF-8

# Configuración de Google OAuth 2.0
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

# Configuración del servidor Web
server.port=8080
server.error.path=/error

# ── Email (Spring Mail / SMTP Gmail) ──────────────────────────────────────────
# Configurar en application-local.properties con las credenciales reales.
# Usar una "Contraseña de aplicación" de Google (no la contraseña de la cuenta).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:notificaciones@idoneos.online}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false
# Nombre que aparece en el From de los emails
idoneos.mail.from.name=Idóneos Online

# ── Imágenes de los cursos ────────────────────────────────────────────────────
# Carpeta del servidor donde se guardan las imágenes subidas (fuera del código) y límites de carga.
idoneos.directorio-cursos=./uploads
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2060MB

# ── Clases en vivo ────────────────────────────────────────────────────────────
# Servidor de medios MediaMTX (docker compose up mediamtx). Las direcciones públicas son las que usan OBS y el navegador;
# la de la API es la que usa la aplicación (dentro de Docker: http://mediamtx:9997). Las grabaciones las escribe MediaMTX
# en uploads/temp/streaming, una carpeta que la aplicación también ve. El secreto firma los accesos de los alumnos y protege la API.
idoneos.streaming.rtmp-url=${IDONEOS_STREAMING_RTMP_URL:rtmp://localhost:1935}
idoneos.streaming.hls-url=${IDONEOS_STREAMING_HLS_URL:http://localhost:8888}
idoneos.streaming.api-url=${IDONEOS_STREAMING_API_URL:http://localhost:9997}
idoneos.streaming.grabaciones=${IDONEOS_STREAMING_GRABACIONES:./uploads/temp/streaming}
idoneos.streaming.secreto=${IDONEOS_STREAMING_SECRETO:idoneos-streaming-secreto-de-desarrollo}

# Tiempo máximo de las llamadas HTTP a servicios externos: si una no responde, se cuenta como falla y se reintenta
spring.http.client.connect-timeout=10s
spring.http.client.read-timeout=10s

# OCR de los PDF escaneados (OCRmyPDF + Tesseract instalados en el servidor). Si el comando no está, los PDF se guardan sin OCR.
idoneos.ocr.habilitado=true
idoneos.ocr.comando=ocrmypdf
idoneos.ocr.idioma=spa+eng
idoneos.ocr.max-paginas=300
idoneos.ocr.max-mb=50
idoneos.ocr.timeout-minutos=60
