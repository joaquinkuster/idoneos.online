<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<body>
    <!-- Visor de PDF (static/js/pages/recurso/visor.js): barra de herramientas, riel lateral con las miniaturas y el índice, y la página. -->
    <div th:fragment="visor(urlArchivo, urlResaltados)" class="mv-visor" data-visor-pdf
         th:attr="data-url=@{${urlArchivo}}, data-url-indice=@{${#strings.replace(urlArchivo, '/archivo/', '/indice/')}}, data-url-resaltados=${urlResaltados != null} ? @{${urlResaltados}} : null">
        <div class="mv-barra">
            <span></span>
            <div class="mv-barra-centro">
                <button type="button" class="mv-boton" data-visor-anterior aria-label="Página anterior"><i class="fa-solid fa-chevron-left"></i></button>
                <span class="mv-paginas">
                    <input type="number" min="1" value="1" data-visor-pagina aria-label="Número de página">
                    <span>de <span data-visor-total>–</span></span>
                </span>
                <button type="button" class="mv-boton" data-visor-siguiente aria-label="Página siguiente"><i class="fa-solid fa-chevron-right"></i></button>
                <span class="mv-sep" aria-hidden="true"></span>
                <span class="mv-zoom">
                    <button type="button" class="mv-boton" data-visor-alejar aria-label="Alejar" title="Alejar (-)"><i class="fa-solid fa-minus"></i></button>
                    <span class="mv-zoom-valor" data-visor-zoom>100%</span>
                    <button type="button" class="mv-boton" data-visor-acercar aria-label="Acercar" title="Acercar (+)"><i class="fa-solid fa-plus"></i></button>
                </span>
                <button type="button" class="mv-ajuste" data-visor-ajuste title="Cambiar cómo se ajusta la página">Ajustar al ancho</button>
                <span class="mv-sep" data-visor-sep-anotar aria-hidden="true" th:if="${urlResaltados != null}" hidden></span>
                <button type="button" class="mv-boton" data-visor-anotar aria-label="Resaltar" aria-pressed="false" title="Resaltar (lápiz, marcador y goma)" th:if="${urlResaltados != null}" hidden><i class="fa-solid fa-highlighter"></i></button>
                <span class="mv-sep" aria-hidden="true"></span>
                <button type="button" class="mv-boton" data-visor-buscar-boton aria-label="Buscar en el documento" aria-pressed="false" title="Buscar en el documento (Ctrl + F)"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div class="mv-barra-derecha">
                <button type="button" class="mv-boton" data-visor-pantalla-completa aria-label="Pantalla completa" title="Pantalla completa"><i class="fa-solid fa-expand"></i></button>
            </div>
        </div>
        <div class="mv-cuerpo">
            <!-- Riel lateral, como el del visor de Chrome: el menú muestra u oculta el panel y los otros dos botones eligen qué se ve en él -->
            <nav class="mv-riel" data-visor-pestanas aria-label="Panel lateral">
                <button type="button" class="mv-boton" data-visor-lateral-boton aria-label="Mostrar u ocultar el panel lateral" aria-expanded="false" title="Mostrar u ocultar el panel lateral"><i class="fa-solid fa-bars"></i></button>
                <button type="button" class="mv-boton" data-visor-pestana="miniaturas" aria-label="Miniaturas" title="Miniaturas"><i class="fa-regular fa-image"></i></button>
                <button type="button" class="mv-boton activa" data-visor-pestana="indice" aria-label="Índice" title="Índice"><i class="fa-solid fa-list"></i></button>
            </nav>
            <aside class="mv-lateral" data-visor-lateral hidden>
                <div class="mv-lista" data-visor-indice></div>
                <div class="mv-lista" data-visor-miniaturas hidden></div>
            </aside>
            <div class="mv-lienzo">
                <div class="mv-buscar" data-visor-buscador hidden>
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <input type="search" placeholder="Buscar en el documento" data-visor-buscar aria-label="Buscar en el documento" autocomplete="off">
                    <small data-visor-contador aria-live="polite"></small>
                    <button type="button" class="mv-boton mv-boton-chico" data-visor-resultado-anterior aria-label="Resultado anterior" title="Resultado anterior (Mayús + Enter)" disabled><i class="fa-solid fa-chevron-up"></i></button>
                    <button type="button" class="mv-boton mv-boton-chico" data-visor-resultado-siguiente aria-label="Resultado siguiente" title="Resultado siguiente (Enter)" disabled><i class="fa-solid fa-chevron-down"></i></button>
                    <button type="button" class="mv-boton mv-boton-chico" data-visor-buscar-cerrar aria-label="Cerrar el buscador" title="Cerrar (Esc)"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="mv-desplazable">
                    <div class="mv-hoja">
                        <canvas class="mv-pagina" aria-label="Página del documento"></canvas>
                        <div class="mv-texto" data-visor-texto aria-hidden="true"></div>
                        <canvas class="mv-trazos" data-visor-trazos aria-hidden="true" th:if="${urlResaltados != null}"></canvas>
                    </div>
                </div>
                <div class="mv-estado mv-estado-skeleton" data-visor-estado role="status"><span class="visually-hidden">Cargando…</span></div>
            </div>
            <!-- Herramientas de resaltado (solo el alumno): lápiz, marcador y goma, con su tamaño y su color -->
            <aside class="mv-herramientas" data-visor-herramientas th:if="${urlResaltados != null}" hidden>
                <div>
                    <span class="mv-etiqueta">Herramienta</span>
                    <div class="mv-fila-herramientas">
                        <button type="button" class="mv-herramienta" data-visor-herramienta="lapiz" aria-label="Lápiz" title="Lápiz"><i class="fa-solid fa-pencil"></i></button>
                        <button type="button" class="mv-herramienta activa" data-visor-herramienta="marcador" aria-label="Marcador" title="Marcador"><i class="fa-solid fa-highlighter"></i></button>
                        <button type="button" class="mv-herramienta" data-visor-herramienta="goma" aria-label="Goma" title="Goma"><i class="fa-solid fa-eraser"></i></button>
                    </div>
                </div>
                <div>
                    <span class="mv-etiqueta">Tamaño</span>
                    <div class="mv-tamanios" data-visor-tamanios></div>
                </div>
                <div>
                    <span class="mv-etiqueta">Color</span>
                    <div class="mv-colores" data-visor-colores></div>
                </div>
            </aside>
        </div>
    </div>
</body>

</html>
