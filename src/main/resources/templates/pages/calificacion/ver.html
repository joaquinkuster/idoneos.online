<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <th:block th:replace="~{fragments/head :: recursos}"></th:block>
</head>
<body class="pn-body">
<div class="pn-app" id="pnApp">
    <th:block th:replace="~{fragments/menus :: gestionAcademica(${menuActivo}, ${urlBase})}"></th:block>

    <div class="pn-principal">
        <th:block th:replace="~{fragments/panel :: barra(null)}"></th:block>

        <main class="pn-contenido">
            <nav class="ac-migas" aria-label="Ruta de navegación">
                <a th:href="@{/inicio}">Página principal</a>
                <i class="fa-solid fa-chevron-right"></i>
                <a th:href="@{${urlMisCursos}}">Mis cursos</a>
                <i class="fa-solid fa-chevron-right"></i>
                <a th:href="@{${urlBase}}" th:text="${curso.nombre}">Curso</a>
                <i class="fa-solid fa-chevron-right"></i>
                <strong>Calificaciones</strong>
            </nav>

            <div class="pn-encabezado">
                <div>
                    <h1 class="pn-titulo">Mis calificaciones</h1>
                    <p class="pn-subtitulo" th:text="${'Tus resultados en las autoevaluaciones de ' + curso.nombre}">Tus resultados</p>
                </div>
            </div>

            <section class="pn-tarjeta" data-tabla>
                <div class="pn-tabla-contenedor">
                    <table class="pn-tabla">
                        <thead>
                            <tr>
                                <th>Unidad</th>
                                <th>Autoevaluación</th>
                                <th>Intentos</th>
                                <th>Mejor nota</th>
                                <th>Resultado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="a : ${autoevaluaciones}" data-fila>
                                <td><span class="pn-truncar pn-truncar-largo" th:text="${a.unidad.titulo}">Introducción</span></td>
                                <td>
                                    <a th:if="${unidadesHabilitadas.contains(a.unidad.idUnidad)}" th:href="@{'/autoevaluacion/ver/' + ${a.idAutoevaluacion}}"
                                       class="pn-truncar" th:text="${a.nombre}">Autoevaluación</a>
                                    <span th:unless="${unidadesHabilitadas.contains(a.unidad.idUnidad)}" class="pn-truncar" th:text="${a.nombre}">Autoevaluación</span>
                                </td>
                                <td th:text="${#lists.size(a.intentosDe(inscripcion)) + (a.intentosPermitidos != null ? ' de ' + a.intentosPermitidos : '')}">1 de 3</td>
                                <td th:text="${a.mejorNota(inscripcion) != null ? #numbers.formatDecimal(a.mejorNota(inscripcion), 1, 2, 'COMMA') + ' / 10,00' : '-'}">8,00 / 10,00</td>
                                <td>
                                    <span class="pn-insignia"
                                          th:classappend="${a.estaAprobadaPor(inscripcion)} ? 'pn-insignia-verde' : 'pn-insignia-gris'"
                                          th:text="${a.estaAprobadaPor(inscripcion) ? 'Aprobada' : (a.mejorNota(inscripcion) != null ? 'No aprobada' : 'Sin rendir')}">Aprobada</span>
                                </td>
                            </tr>
                            <tr th:replace="~{fragments/vacio :: fila(5, 'fa-star', 'Todavía no hay autoevaluaciones', 'Cuando el docente publique autoevaluaciones, vas a ver tus resultados acá.')}"></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <th:block th:replace="~{fragments/panel :: pie('Gestión académica')}"></th:block>
    </div>
</div>

<th:block th:replace="~{fragments/panel :: scripts}"></th:block>
<script th:src="@{/js/academica.js}"></script>
</body>
</html>
