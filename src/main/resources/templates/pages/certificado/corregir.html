<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
<!-- Ventana de modificación. -->
    <div th:fragment="modal(i)" class="modal fade pn-modal" th:id="'modalCertificado' + ${i.idInscripcion}" tabindex="-1" aria-hidden="true"
        >
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="pn-modal-cabecera">
                    <h3 class="pn-modal-titulo">Corregir datos del certificado</h3>
                    <button type="button" class="pn-modal-cerrar" data-bs-dismiss="modal" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="pn-modal-cuerpo">
                    <!-- El certificado se deriva de la inscripción: en el resumen es una rama más, con su número como título -->
                    <form th:action="@{'/certificado/corregir/' + ${i.certificadoVigente.idCertificado}}" method="post" class="form-ajax" data-validar data-pasos
                          data-resumen="Certificado" data-modo="modificacion"
                          data-contexto='[{"etiqueta":"Curso","atributoForm":"data-ctx-curso"},{"etiqueta":"Programa","atributoForm":"data-ctx-programa"},{"etiqueta":"Cohorte","atributoForm":"data-ctx-cohorte"},{"etiqueta":"Inscripción","atributoForm":"data-ctx-alumno"}]'
                          th:attr="data-resumen-nombre=${i.certificadoVigente.numero}, data-ctx-curso=${i.curso.nombre}, data-ctx-programa=${i.cohorte.programa.nombre}, data-ctx-cohorte=${i.cohorte.etiqueta}, data-ctx-alumno=${i.alumno.usuario.nombreCompleto}"
                          novalidate>
                        <div class="pn-pasos pn-pasos-nombrados">
                            <span class="pn-pasos-item"><span class="pn-pasos-punto">1</span><span class="pn-pasos-nombre">Datos del certificado</span></span><span class="pn-pasos-linea"></span>
                            <span class="pn-pasos-item"><span class="pn-pasos-punto">2</span><span class="pn-pasos-nombre">Resumen</span></span>
                        </div>
                        <div class="pn-paso" data-grupo="Datos del certificado">
                            <div class="pn-seccion-titulo">
                                <h4>Datos del certificado</h4>
                                <p>Nombre y DNI del alumno</p>
                            </div>
                            <div class="pn-campo">
                                <div class="pn-etiqueta-fila">
                                    <label class="pn-etiqueta">Nombre del alumno <span class="pn-obligatorio">*</span></label>
                                    <span class="pn-contador" th:text="${#strings.length(i.certificadoVigente.nombreAlumno) + ' / 100'}">0 / 100</span>
                                </div>
                                <input type="text" name="nombre" class="pn-input" maxlength="100" th:value="${i.certificadoVigente.nombreAlumno}" data-contador required>
                                <div class="pn-ayuda-error"></div>
                            </div>
                            <div class="pn-campo">
                                <label class="pn-etiqueta">DNI <span class="pn-obligatorio">*</span></label>
                                <input type="text" name="dni" class="pn-input" maxlength="8" inputmode="numeric" th:value="${i.certificadoVigente.dniAlumno}" required>
                                <div class="pn-ayuda-error"></div>
                            </div>
                        </div>
                        <div class="pn-paso">
                            <div class="pn-seccion-titulo">
                                <h4>Resumen</h4>
                                <p>Estos son los cambios que se van a guardar</p>
                            </div>
                            <div class="pn-arbol" data-resumen-arbol></div>
                        </div>
                        <div class="pn-modal-pie">
                            <button type="button" class="pn-btn pn-btn-contorno pn-pie-izquierda" data-paso-anterior>Anterior</button>
                            <button type="button" class="pn-btn pn-btn-secundario" data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="pn-btn pn-btn-primario" data-paso-siguiente>Siguiente</button>
                            <button type="submit" class="pn-btn pn-btn-primario d-none" data-paso-guardar>Confirmar cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
