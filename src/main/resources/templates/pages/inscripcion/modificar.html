<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
<!-- Ventana de modificación. No va dentro del listado: el servidor la devuelve cuando se la pide (GET /inscripcion/modificar/{id}). -->
    <div th:fragment="modal(i)" class="modal fade pn-modal" th:id="'modalModificarInscripcion' + ${i.idInscripcion}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="pn-modal-cabecera">
                    <h3 class="pn-modal-titulo">Editar inscripción</h3>
                    <button type="button" class="pn-modal-cerrar" data-bs-dismiss="modal" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="pn-modal-cuerpo">
                    <form th:action="@{'/inscripcion/modificar/' + ${i.idInscripcion}}" method="post" class="form-ajax" data-validar data-pasos data-resumen="Inscripción" data-modo="modificacion"
                          data-contexto='[{"etiqueta":"Curso","atributoForm":"data-ctx-curso"},{"etiqueta":"Programa","atributoForm":"data-ctx-programa"},{"etiqueta":"Cohorte","atributoForm":"data-ctx-cohorte"}]' 
                          th:attr="data-resumen-nombre=${i.alumno.usuario.nombreCompleto}, data-ctx-curso=${i.cohorte.programa.curso.nombre}, data-ctx-programa=${i.cohorte.programa.nombre}, data-ctx-cohorte=${i.cohorte.etiqueta}" novalidate>
    <div class="pn-pasos pn-pasos-nombrados">
        <span class="pn-pasos-item"><span class="pn-pasos-punto">1</span><span class="pn-pasos-nombre">Datos de la inscripción</span></span><span class="pn-pasos-linea"></span>
        <span class="pn-pasos-item"><span class="pn-pasos-punto">2</span><span class="pn-pasos-nombre">Resumen</span></span>
    </div>
    <div class="pn-paso" data-grupo="Datos de la inscripción">
        <div class="pn-seccion-titulo">
            <h4>Datos de la inscripción</h4>
            <p>Suspensión del acceso y observaciones</p>
        </div>
        <div class="row g-3">
<div class="col-12 pn-campo">
                                <label class="pn-etiqueta">Suspendida</label>
                                <!-- Solo se suspende una inscripción habilitada y se reactiva la suspendida; pendiente de pago o cancelada no se modifica -->
                                <select name="habilitada" class="pn-input" th:disabled="${!i.tieneAcceso() and !i.estaSuspendida()}">
                                    <!-- Sí suspende (habilitada = false) y No reactiva (habilitada = true) -->
                                    <option value="false" th:selected="${i.estaSuspendida()}">Sí</option>
                                    <option value="true" th:selected="${!i.estaSuspendida()}">No</option>
                                </select>
                                <div class="pn-ayuda-error"></div>
                            </div>
<div class="col-12 pn-campo">
                                <div class="pn-etiqueta-fila">
                                    <label class="pn-etiqueta">Observaciones (opcional)</label>
                                    <span class="pn-contador" th:text="${#strings.length(i.observaciones != null ? i.observaciones : '') + ' / 500'}">0 / 500</span>
                                </div>
                                <textarea name="observaciones" class="pn-input" rows="3" maxlength="500" data-contador th:text="${i.observaciones}"></textarea>
                                <div class="pn-ayuda-error"></div>
                            </div>
        </div>
    </div>
    <div class="pn-paso">
        <div class="pn-seccion-titulo">
            <h4>Resumen</h4>
            <p>Estos son los cambios que se van a guardar</p>
        </div>
        <div class="pn-arbol" data-resumen-arbol></div>
    </div>
    <div class="pn-modal-pie">
        <button type="button" class="pn-btn pn-btn-contorno pn-pie-izquierda" data-paso-anterior>Anterior</button>
        <button type="button" class="pn-btn pn-btn-secundario" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="pn-btn pn-btn-primario" data-paso-siguiente>Siguiente</button>
        <button type="submit" class="pn-btn pn-btn-primario d-none" data-paso-guardar>Confirmar cambios</button>
    </div>
</form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
