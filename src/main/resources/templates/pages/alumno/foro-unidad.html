<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Header -->
<div class="bg-dark text-white py-4 mb-4">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
            <h1 class="fw-bold mb-1" th:text="'Foro — ' + ${unidad.titulo}">Foro de Unidad</h1>
            <small class="text-white-50" th:text="${unidad.curso.nombre}">Curso</small>
        </div>
        <a th:href="@{'/cursos/' + ${unidad.curso.id} + '/cursada'}" class="btn btn-outline-light rounded-pill">
            <i class="fa-solid fa-arrow-left me-2"></i>Volver a la Cursada
        </a>
    </div>
</div>

<div class="container pb-5">

    <!-- Flash message -->
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show shadow-sm rounded-3 mb-4" role="alert">
        <i class="fa-solid fa-circle-check me-2"></i>
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Nueva Consulta -->
    <div class="card shadow-sm border-0 rounded-4 mb-4">
        <div class="card-body p-4">
            <h5 class="fw-bold mb-3"><i class="fa-solid fa-comment-dots me-2 text-primary"></i>Hacer una consulta</h5>
            <form th:action="@{'/foro/unidad/' + ${unidad.id} + '/consulta/nueva'}" method="post">
                <div class="mb-3">
                    <textarea name="texto" class="form-control rounded-3" rows="3" required placeholder="Escribí tu pregunta o duda sobre esta unidad..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary rounded-pill fw-bold">
                    <i class="fa-solid fa-paper-plane me-2"></i>Publicar Consulta
                </button>
            </form>
        </div>
    </div>

    <!-- Lista de Consultas -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">Consultas de la Unidad</h5>
        <span class="badge bg-secondary rounded-pill" th:text="${consultas.size()} + ' preguntas'">0 preguntas</span>
    </div>

    <div th:if="${consultas.isEmpty()}" class="text-center py-5 bg-white rounded-4 shadow-sm">
        <i class="fa-solid fa-comments fa-3x text-muted mb-3"></i>
        <p class="text-muted mb-0">No hay consultas en esta unidad aún. ¡Sé el primero en preguntar!</p>
    </div>

    <div th:each="consulta : ${consultas}" class="card shadow-sm border-0 rounded-4 mb-3">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-start mb-2">
                <div class="d-flex align-items-center gap-2">
                    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width:38px; height:38px;"
                         th:text="${#strings.substring(consulta.usuario.nombre, 0, 1)}">U</div>
                    <div>
                        <strong class="d-block" th:text="${consulta.usuario.nombreCompleto}">Usuario</strong>
                        <small class="text-muted" th:text="${#temporals.format(consulta.fecha, 'dd/MM/yyyy')}">Fecha</small>
                    </div>
                </div>
                <form th:if="${usuario.id == consulta.usuario.id || usuario.esAdmin()}"
                      th:action="@{'/foro/consulta/' + ${consulta.id} + '/borrar'}" method="post">
                    <button type="submit" class="btn btn-link text-danger p-0 border-0" onclick="return confirm('¿Eliminar consulta?')">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </form>
            </div>

            <p class="card-text text-dark fs-6 mt-2 mb-3" th:text="${consulta.texto}">Texto de la consulta</p>

            <!-- Respuestas de docentes -->
            <div class="ms-4 border-start border-3 border-primary ps-3 pt-2">
                <div th:each="resp : ${consulta.respuestas}" th:if="${!resp.baja}" class="bg-light p-3 rounded-3 mb-2">
                    <div class="d-flex align-items-center gap-2 mb-1">
                        <span class="badge bg-success"><i class="fa-solid fa-user-graduate me-1"></i>Docente</span>
                        <strong th:text="${resp.docente.nombreCompleto}">Docente</strong>
                        <small class="text-muted" th:text="${#temporals.format(resp.fecha, 'dd/MM/yyyy')}">Fecha</small>
                    </div>
                    <p class="mb-0 text-secondary" th:text="${resp.texto}">Texto de la respuesta</p>
                </div>

                <!-- Formulario responder (solo si es Docente/Admin) -->
                <div th:if="${usuario.esDocente() || usuario.esAdmin()}" class="mt-3">
                    <form th:action="@{'/foro/consulta/' + ${consulta.id} + '/responder'}" method="post" class="d-flex gap-2">
                        <input type="text" name="texto" class="form-control form-control-sm rounded-3" placeholder="Responder a esta consulta..." required>
                        <button type="submit" class="btn btn-sm btn-success rounded-pill px-3 text-nowrap">Responder</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
