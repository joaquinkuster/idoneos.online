<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body>
    <header th:replace="~{fragments/navbar :: navbar}"></header>

    <main class="container py-5 idn-fade">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <!-- Comprobante de Pago Acreditado -->
                <div class="card idn-card border-0 shadow-lg text-center p-5 bg-white">
                    <div class="mb-3">
                        <div class="rounded-circle bg-success-subtle text-success d-inline-flex align-items-center justify-content-center"
                             style="width: 76px; height: 76px;">
                            <i class="fa-solid fa-check fs-1"></i>
                        </div>
                    </div>

                    <h2 class="font-serif fw-bold text-navy mb-1">¡Pago Acreditado Exitosamente!</h2>
                    <p class="text-muted mb-4">Tu inscripción ha sido confirmada y tu acceso al aula virtual está habilitado.</p>

                    <div class="card bg-light border-0 rounded-4 p-4 text-start mb-4">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted small">Número de Comprobante:</span>
                            <strong class="text-navy" th:text="'#' + (${pago.comprobante != null ? pago.comprobante : pago.id})">#12345</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted small">Fecha y Hora:</span>
                            <strong class="text-navy" th:text="${pago.fecha != null ? #temporals.format(pago.fecha, 'dd/MM/yyyy HH:mm:ss') : '-'}">01/01/2026 12:00</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted small">Estado:</span>
                            <span class="badge bg-success-subtle text-success border border-success-subtle" th:text="${pago.estadoPago != null ? pago.estadoPago.nombre : 'Acreditado'}">Acreditado</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2" th:if="${pago.inscripcion != null and pago.inscripcion.cohorte != null and pago.inscripcion.cohorte.programa != null and pago.inscripcion.cohorte.programa.curso != null}">
                            <span class="text-muted small">Curso:</span>
                            <strong class="text-navy" th:text="${pago.inscripcion.cohorte.programa.curso.nombre}">Curso de Finanzas</strong>
                        </div>
                        <hr class="my-2">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="fw-bold text-navy">Monto Abonado:</span>
                            <span class="fs-4 font-serif fw-bold text-gold" th:text="'$' + ${#numbers.formatDecimal(pago.monto, 1, 2)}">$0.00</span>
                        </div>
                    </div>

                    <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
                        <a th:if="${pago.inscripcion != null and pago.inscripcion.cohorte != null and pago.inscripcion.cohorte.programa != null and pago.inscripcion.cohorte.programa.curso != null}"
                           th:href="@{/cursos/{id}/mi-cursada(id=${pago.inscripcion.cohorte.programa.curso.id})}" 
                           class="btn idn-btn-gold px-4 py-2 fw-bold">
                            <i class="fa-solid fa-circle-play me-2"></i> Ingresar al Aula Virtual
                        </a>
                        <a th:href="@{/cursos/mis-cursos}" class="btn btn-outline-secondary rounded-pill px-4 py-2">
                            <i class="fa-solid fa-book-open me-2"></i> Mis Cursos
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
