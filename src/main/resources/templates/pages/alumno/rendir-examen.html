<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Header -->
<div class="py-4 mb-4" style="background: linear-gradient(135deg, #1e3a5f 0%, #2d6a9f 100%);">
    <div class="container">
        <h1 class="fw-bold text-white mb-1">
            <i class="fa-solid fa-pen-to-square me-2"></i>
            <span th:text="${autoevaluacion.nombre}">Autoevaluación</span>
        </h1>
        <p class="text-white-50 mb-0">
            Respondé todas las preguntas y enviá el formulario para ver tu resultado.
            Tiempo límite: <strong th:text="${autoevaluacion.tiempoLimite != null ? autoevaluacion.tiempoLimite + ' min' : 'Sin límite'}">-</strong>
        </p>
    </div>
</div>

<div class="container pb-5">

    <!-- Error de intentos agotados -->
    <div th:if="${error}" class="alert alert-danger shadow-sm rounded-3 mb-4">
        <i class="fa-solid fa-triangle-exclamation me-2"></i>
        <span th:text="${error}"></span>
    </div>

    <form th:if="${preguntas != null and !preguntas.isEmpty()}"
          th:action="@{'/evaluacion/' + ${autoevaluacion.id} + '/enviar'}" method="post" id="examenForm">

        <!-- Timer si tiene límite -->
        <div th:if="${autoevaluacion.tiempoLimite != null}" class="alert alert-warning shadow-sm rounded-3 mb-4 d-flex align-items-center">
            <i class="fa-solid fa-clock me-3 fs-4"></i>
            <div>
                <strong>Tiempo restante: </strong>
                <span id="timer" class="fw-bold text-danger fs-5"
                      th:data-minutos="${autoevaluacion.tiempoLimite}">--:--</span>
            </div>
        </div>

        <!-- Preguntas -->
        <div th:each="pregunta, i : ${preguntas}" class="card shadow-sm border-0 rounded-4 mb-4">
            <div class="card-body p-4">
                <p class="fw-semibold mb-3">
                    <span class="badge bg-primary rounded-pill me-2" th:text="${i.index + 1}">1</span>
                    <span th:text="${pregunta.texto}">Pregunta</span>
                    <span class="badge ms-2 small"
                          th:classappend="${pregunta.esOpcionMultiple} ? 'bg-info text-dark' : 'bg-secondary'"
                          th:text="${pregunta.esOpcionMultiple} ? 'Opción Múltiple' : 'V/F'">tipo</span>
                </p>

                <div class="ms-2">
                    <div th:each="opcion : ${pregunta.opciones}" th:if="${!opcion.baja}" class="form-check mb-2">
                        <input class="form-check-input" type="radio"
                               th:name="'pregunta_' + ${pregunta.id}"
                               th:value="${opcion.id}"
                               th:id="'op_' + ${opcion.id}" required>
                        <label class="form-check-label" th:for="'op_' + ${opcion.id}" th:text="${opcion.texto}">Opción</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Enviar -->
        <div class="d-flex justify-content-between align-items-center mt-4">
            <span class="text-muted">
                <i class="fa-solid fa-info-circle me-1"></i>
                <span th:text="${preguntas.size()} + ' preguntas en total'">N preguntas</span>
            </span>
            <button type="submit" class="btn btn-success btn-lg rounded-pill fw-bold shadow"
                    onclick="return confirm('¿Estás seguro de enviar el examen?')">
                <i class="fa-solid fa-paper-plane me-2"></i>Enviar Respuestas
            </button>
        </div>
    </form>

    <!-- Sin preguntas -->
    <div th:if="${preguntas == null or preguntas.isEmpty()}" class="text-center py-5">
        <i class="fa-solid fa-circle-exclamation fa-3x text-muted mb-3"></i>
        <p class="text-muted">Esta autoevaluación no tiene preguntas aún.</p>
    </div>

</div>

<script th:if="${autoevaluacion.tiempoLimite != null}">
document.addEventListener('DOMContentLoaded', function () {
    const timerEl = document.getElementById('timer');
    let segundos = parseInt(timerEl.dataset.minutos) * 60;
    const intervalo = setInterval(() => {
        const m = Math.floor(segundos / 60).toString().padStart(2, '0');
        const s = (segundos % 60).toString().padStart(2, '0');
        timerEl.textContent = m + ':' + s;
        if (segundos <= 0) {
            clearInterval(intervalo);
            document.getElementById('examenForm').submit();
        }
        segundos--;
    }, 1000);
});
</script>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
