<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
<!-- Ventana de modificación. No va dentro del listado: el servidor la devuelve cuando se la pide (GET /termino/modificar/{id}). -->
        <div th:fragment="modal(t)" class="modal fade pn-modal" th:id="'modalModificarTermino' + ${t.idTermino}" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content">
                    <div class="pn-modal-cabecera">
                        <h3 class="pn-modal-titulo">Editar término</h3>
                        <button type="button" class="pn-modal-cerrar" data-bs-dismiss="modal" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="pn-modal-cuerpo">
                        <div class="pn-seccion-titulo">
                            <h4>Datos del término</h4>
                            <p>Término y definición</p>
                        </div>
                        <form th:action="@{'/termino/modificar/' + ${t.idTermino}}" method="post" class="form-ajax" data-validar novalidate>
                            <div class="row g-3 mb-3">
                                <div class="col-12 pn-campo">
                                    <div class="pn-etiqueta-fila">
                                        <label class="pn-etiqueta">Término <span class="pn-obligatorio">*</span></label>
                                        <span class="pn-contador" th:text="${#strings.length(t.termino) + ' / 50'}">0 / 50</span>
                                    </div>
                                    <input type="text" name="termino" class="pn-input" maxlength="50" th:value="${t.termino}" data-contador required
                                           data-mensaje-obligatorio="Debe completar el término.">
                                    <div class="pn-ayuda-error"></div>
                                </div>
                                <div class="col-12 pn-campo">
                                    <div class="pn-etiqueta-fila">
                                        <label class="pn-etiqueta">Definición <span class="pn-obligatorio">*</span></label>
                                        <span class="pn-contador" th:text="${#strings.length(t.definicion) + ' / 500'}">0 / 500</span>
                                    </div>
                                    <textarea name="definicion" class="pn-input" rows="5" maxlength="500" data-contador required
                                              data-mensaje-obligatorio="Debe completar la definición." th:text="${t.definicion}"></textarea>
                                    <div class="pn-ayuda-error"></div>
                                </div>
                            </div>
                            <div class="pn-modal-pie">
                                <button type="button" class="pn-btn pn-btn-secundario" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="pn-btn pn-btn-primario">Actualizar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
</body>
</html>
