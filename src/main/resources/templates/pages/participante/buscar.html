<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <th:block th:replace="~{fragments/head :: recursos}"></th:block>
</head>
<body class="pn-body">
<div class="pn-app" id="pnApp">
    <th:block th:replace="~{fragments/menus :: gestionAcademica(${menuActivo}, ${urlBase})}"></th:block>

    <div class="pn-principal">
        <th:block th:replace="~{fragments/panel :: barra(null)}"></th:block>

        <main class="pn-contenido">
            <nav class="ac-migas" aria-label="Ruta de navegación">
                <a th:href="@{/inicio}">Página principal</a>
                <i class="fa-solid fa-chevron-right"></i>
                <a th:href="@{${urlMisCursos}}" th:text="${esAdministrador == true ? 'Cursos' : 'Mis cursos'}">Mis cursos</a>
                <i class="fa-solid fa-chevron-right"></i>
                <a th:href="@{${urlBase}}" th:text="${curso.nombre}">Curso</a>
                <i class="fa-solid fa-chevron-right"></i>
                <strong>Participantes</strong>
            </nav>

            <div class="pn-encabezado">
                <div>
                    <h1 class="pn-titulo">Participantes</h1>
                    <p class="pn-subtitulo" th:text="${soloCohorte ? 'Equipo docente de ' + curso.nombre + ' y alumnos de tu cohorte' : 'Equipo docente y alumnos de ' + curso.nombre}">Equipo docente y alumnos del curso</p>
                </div>
            </div>

            <section class="pn-tarjeta" data-tabla>
                <div class="pn-lista-cabecera">
                    <h2 class="pn-lista-titulo">Listado de participantes</h2>
                    <span class="pn-seleccionados" data-total-filtradas data-singular="participante encontrado" data-plural="participantes encontrados"
                          th:text="${#lists.size(participantes) + (#lists.size(participantes) == 1 ? ' participante encontrado' : ' participantes encontrados')}">0 participantes encontrados</span>
                </div>

                <!-- Filtros: se aplican en el navegador, sin recargar -->
                <form class="pn-filtros" data-filtro-front>
                    <div class="pn-filtros-campo pn-filtros-campo-grande">
                        <label class="pn-etiqueta">Nombre o apellido</label>
                        <input type="text" name="busqueda" class="pn-input" placeholder="Buscar por nombre o apellido" autocomplete="off">
                    </div>
                    <div class="pn-filtros-campo">
                        <label class="pn-etiqueta">Rol</label>
                        <select name="rol" class="pn-input">
                            <option value="">Todos</option>
                            <option value="Docente">Docente</option>
                            <option value="Alumno">Alumno</option>
                        </select>
                    </div>
                    <div class="pn-filtros-campo" th:unless="${soloCohorte}">
                        <label class="pn-etiqueta">Cohorte</label>
                        <select name="cohorte" class="pn-input">
                            <option value="">Todas las cohortes</option>
                            <option th:each="c : ${cohortes}" th:value="${c.etiqueta}" th:text="${c.etiqueta}"
                                    th:selected="${cohorteSeleccionada != null and cohorteSeleccionada == c.idCohorte}">Septiembre 2026</option>
                        </select>
                    </div>
                    <a th:href="@{${urlBase}}" class="pn-btn pn-btn-contorno">Limpiar</a>
                </form>

                <div class="pn-tabla-contenedor">
                    <table class="pn-tabla">
                        <thead>
                            <tr>
                                <th>Nombre / Apellido</th>
                                <th>Rol</th>
                                <th th:unless="${soloCohorte}">Cohorte</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${participantes}" data-fila
                                th:data-f-busqueda="${p.nombre + ' ' + p.apellido}"
                                th:data-f-rol="${p.esDocente() ? 'Docente|' + p.rol : p.rol}"
                                th:attr="data-f-cohorte=${p.cohorte != null ? p.cohorte.etiqueta : null}">
                                <td>
                                    <span class="pn-celda-principal d-inline-flex align-items-center gap-2">
                                        <th:block th:replace="~{fragments/avatar :: avatar(${p.usuario}, 'av-chico')}"></th:block>
                                        <span class="pn-truncar pn-truncar-largo" th:text="${p.nombre + ', ' + p.apellido}">Valentina, Ruiz</span>
                                    </span>
                                </td>
                                <td>
                                    <span class="pn-insignia"
                                          th:classappend="${p.rol == 'Docente titular'} ? 'pn-insignia-dorada' : (${p.rol == 'Docente ayudante'} ? 'pn-insignia-azul' : 'pn-insignia-verde')"
                                          th:text="${p.rol}">Alumno</span>
                                </td>
                                <td th:unless="${soloCohorte}" th:text="${p.cohorte != null ? p.cohorte.etiqueta : '—'}">Septiembre 2026</td>
                            </tr>
                            <tr th:replace="~{fragments/vacio :: fila(${soloCohorte ? 2 : 3}, 'fa-users', ${#lists.isEmpty(participantes) ? 'Todavía no hay participantes' : 'No se encontraron participantes'}, ${#lists.isEmpty(participantes) ? 'Cuando haya docentes o alumnos en el curso, vas a verlos acá.' : 'Ningún participante coincide con los criterios ingresados.'})}"></tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pie: filas por página y paginador -->
                <div class="pn-tabla-pie">
                    <div class="pn-por-pagina">
                        <span>Filas por página:</span>
                        <select data-por-pagina>
                            <option value="10">10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="0">Todo</option>
                        </select>
                        <span data-rango>0-0 de 0</span>
                    </div>
                    <div class="pn-paginador" data-paginador></div>
                </div>
            </section>
        </main>

        <th:block th:replace="~{fragments/panel :: pie(${esAdministrador == true ? 'Panel del administrador' : 'Gestión académica'})}"></th:block>
    </div>
</div>

<th:block th:replace="~{fragments/panel :: scripts}"></th:block>
<script th:src="@{/js/academica.js}"></script>
</body>
</html>
