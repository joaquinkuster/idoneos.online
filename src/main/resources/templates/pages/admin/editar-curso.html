<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Curso | Idóneos Online</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <style>
        .form-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 700px; margin: 2rem auto; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #374151; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; }
        .btn-submit { background: #1a56db; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container">
        <div class="form-card">
            <h2>Editar Curso</h2>

            <form th:action="@{/admin/cursos/{id}/editar(id=${cursoEditar.id})}" method="post">
                <div class="form-group">
                    <label for="nombre">Nombre del Curso</label>
                    <input type="text" id="nombre" name="nombre" th:value="${cursoEditar.nombre}" required>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion" rows="4" required th:text="${cursoEditar.descripcion}"></textarea>
                </div>

                <div class="form-group">
                    <label for="precio">Precio ($ ARS)</label>
                    <input type="number" step="0.01" id="precio" name="precio" th:value="${cursoEditar.precio}" required>
                </div>

                <div class="form-group">
                    <label for="categoriaId">Categoría</label>
                    <select id="categoriaId" name="categoriaId" required>
                        <option th:each="cat : ${categorias}" 
                                th:value="${cat.id}" 
                                th:text="${cat.nombre}"
                                th:selected="${cat.id == cursoEditar.categoria.id}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="docenteTitularId">Docente Titular</label>
                    <select id="docenteTitularId" name="docenteTitularId" required>
                        <option th:each="d : ${docentes}" 
                                th:value="${d.id}" 
                                th:text="${d.usuario.nombreCompleto}"
                                th:selected="${cursoEditar.docenteTitular != null && d.id == cursoEditar.docenteTitular.id}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="docenteSupervisorId">Docente Supervisor</label>
                    <select id="docenteSupervisorId" name="docenteSupervisorId">
                        <option value="">Ninguno</option>
                        <option th:each="d : ${docentes}" 
                                th:value="${d.id}" 
                                th:text="${d.usuario.nombreCompleto}"
                                th:selected="${cursoEditar.docenteSupervisor != null && d.id == cursoEditar.docenteSupervisor.id}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mesesAcceso">Meses de Acceso</label>
                    <input type="number" id="mesesAcceso" name="mesesAcceso" th:value="${cursoEditar.mesesAcceso}" min="1" required>
                </div>

                <div style="display: flex; gap: 1rem; align-items: center;">
                    <button type="submit" class="btn-submit">Guardar Cambios</button>
                    <a th:href="@{/admin/cursos}" style="color: #6b7280; text-decoration: none;">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
