<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Curso | Idóneos Online</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <style>
        .form-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 700px; margin: 2rem auto; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #374151; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; }
        .btn-submit { background: #1a56db; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-submit:hover { background: #1e40af; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container">
        <div class="form-card">
            <h2>Crear Nuevo Curso (Admin)</h2>
            <p style="color: #6b7280; margin-bottom: 1.5rem;">Carga los datos iniciales del curso. Podrás asignar titular y supervisor.</p>

            <form th:action="@{/admin/cursos/guardar}" method="post">
                <div class="form-group">
                    <label for="nombre">Nombre del Curso *</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: Introducción al Mercado de Capitales">
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción *</label>
                    <textarea id="descripcion" name="descripcion" rows="4" required placeholder="Breve resumen del contenido y objetivos..."></textarea>
                </div>

                <div class="form-group">
                    <label for="precio">Precio ($ ARS) *</label>
                    <input type="number" step="0.01" id="precio" name="precio" required placeholder="0.00 para gratuito">
                </div>

                <div class="form-group">
                    <label for="categoriaId">Categoría *</label>
                    <select id="categoriaId" name="categoriaId" required>
                        <option value="">Seleccione una categoría</option>
                        <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="docenteTitularId">Docente Titular *</label>
                    <select id="docenteTitularId" name="docenteTitularId" required>
                        <option value="">Seleccione el docente responsable</option>
                        <option th:each="d : ${docentes}" th:value="${d.id}" th:text="${d.usuario.nombreCompleto}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="docenteSupervisorId">Docente Supervisor (Opcional)</label>
                    <select id="docenteSupervisorId" name="docenteSupervisorId">
                        <option value="">Ninguno</option>
                        <option th:each="d : ${docentes}" th:value="${d.id}" th:text="${d.usuario.nombreCompleto}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mesesAcceso">Meses de Acceso *</label>
                    <input type="number" id="mesesAcceso" name="mesesAcceso" value="12" min="1" required>
                </div>

                <div style="display: flex; gap: 1rem; align-items: center;">
                    <button type="submit" class="btn-submit">Guardar Curso</button>
                    <a th:href="@{/admin/cursos}" style="color: #6b7280; text-decoration: none;">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
