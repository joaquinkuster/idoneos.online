<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="bg-dark text-white py-4 mb-4">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
            <h1 class="fw-bold mb-0">Gestión de Cursos</h1>
            <a th:href="@{/admin}" class="btn btn-outline-light rounded-pill">Volver al Panel</a>
        </div>
    </div>

    <div class="container mb-5">
        <div th:if="${mensaje != null}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre del Curso</th>
                            <th>Categoría</th>
                            <th>Docente Titular</th>
                            <th>Precio</th>
                            <th>Unidades</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${cursos}" th:classappend="${c.getBaja() ? 'table-secondary text-muted' : ''}">
                            <td th:text="${c.id}">1</td>
                            <td class="fw-bold" th:text="${c.nombre}">Nombre</td>
                            <td><span class="badge bg-primary rounded-pill" th:text="${c.categoria.nombre}">Cat</span></td>
                            <td th:text="${c.docenteTitular.nombreCompleto}">Docente</td>
                            <td>
                                <span th:if="${c.esGratuito()}" class="text-success fw-bold">GRATIS</span>
                                <span th:if="${!c.esGratuito()}" th:text="'$' + ${#numbers.formatDecimal(c.precio, 1, 'POINT', 0, 'COMMA')}">$0</span>
                            </td>
                            <td th:text="${c.unidades.size()}">0</td>
                            <td>
                                <span th:if="${c.getPublicado() && !c.getBaja()}" class="badge bg-success rounded-pill">Publicado</span>
                                <span th:if="${!c.getPublicado() && !c.getBaja()}" class="badge bg-warning text-dark rounded-pill">Borrador</span>
                                <span th:if="${c.getBaja()}" class="badge bg-secondary rounded-pill">Eliminado</span>
                            </td>
                            <td class="text-center">
                                <div class="d-flex gap-2 justify-content-center" th:if="${!c.getBaja()}">
                                    <form th:action="@{'/admin/cursos/' + ${c.id} + '/toggle-publicado'}" method="post">
                                        <button class="btn btn-sm rounded-pill" type="submit"
                                                th:classappend="${c.getPublicado() ? 'btn-outline-warning' : 'btn-outline-success'}"
                                                th:text="${c.getPublicado() ? 'Ocultar' : 'Publicar'}"></button>
                                    </form>
                                    <form th:action="@{'/admin/cursos/' + ${c.id} + '/eliminar'}" method="post"
                                          onsubmit="return confirm('¿Eliminar este curso del sistema?')">
                                        <button class="btn btn-sm btn-outline-danger rounded-pill" type="submit">
                                            <i class="fa-solid fa-trash"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
