<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Descuento | Idóneos Online</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <style>
        .form-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); max-width: 600px; margin: 2rem auto; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #374151; }
        .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; }
        .btn-submit { background: #1a56db; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container">
        <div class="form-card">
            <h2>Editar Descuento</h2>

            <form th:action="@{/admin/descuentos/{id}/editar(id=${descuentoEditar.id})}" method="post">
                <div class="form-group">
                    <label for="nombre">Nombre del Descuento *</label>
                    <input type="text" id="nombre" name="nombre" th:value="${descuentoEditar.nombre}" required>
                </div>

                <div class="form-group">
                    <label for="porcentaje">Porcentaje de Descuento (%) *</label>
                    <input type="number" step="0.1" min="1" max="100" id="porcentaje" name="porcentaje" th:value="${descuentoEditar.porcentaje}" required>
                </div>

                <div class="form-group">
                    <label for="vigenciaDesde">Vigencia Desde *</label>
                    <input type="datetime-local" id="vigenciaDesde" name="vigenciaDesde" th:value="${#temporals.format(descuentoEditar.vigenciaDesde, 'yyyy-MM-dd''T''HH:mm')}" required>
                </div>

                <div class="form-group">
                    <label for="vigenciaHasta">Vigencia Hasta *</label>
                    <input type="datetime-local" id="vigenciaHasta" name="vigenciaHasta" th:value="${#temporals.format(descuentoEditar.vigenciaHasta, 'yyyy-MM-dd''T''HH:mm')}" required>
                </div>

                <div class="form-group">
                    <label for="cantidadLimite">Límite de Usos (Opcional)</label>
                    <input type="number" id="cantidadLimite" name="cantidadLimite" th:value="${descuentoEditar.cantidadLimite}">
                </div>

                <div class="form-group">
                    <label for="cursosRequeridos">Cursos Previos Requeridos (Regla PA-3)</label>
                    <input type="number" id="cursosRequeridos" name="cursosRequeridos" th:value="${descuentoEditar.cursosRequeridos}" min="0">
                </div>

                <div style="display: flex; gap: 1rem; align-items: center;">
                    <button type="submit" class="btn-submit">Guardar Cambios</button>
                    <a th:href="@{/admin/descuentos}" style="color: #6b7280; text-decoration: none;">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
