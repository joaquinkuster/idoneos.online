<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="bg-dark text-white py-4 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="fw-bold mb-0">Gestión de Categorías Académicas</h1>
            <a th:href="@{/admin}" class="btn btn-outline-light rounded-pill">Volver al Panel</a>
        </div>
    </div>

    <div class="container mb-5">
        <div th:if="${mensaje != null}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row g-4">
            <!-- Formulario Nueva Categoría -->
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                    <h5 class="fw-bold mb-3">Nueva Categoría</h5>
                    <form th:action="@{/admin/categorias/crear}" method="post">
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-bold">Nombre</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" required placeholder="Ej: Impuestos...">
                        </div>
                        <div class="mb-3">
                            <label for="descripcion" class="form-label fw-bold">Descripción</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="3" placeholder="Descripción breve..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-warning w-100 rounded-pill fw-bold">Guardar Categoría</button>
                    </form>
                </div>
            </div>

            <!-- Lista de Categorías -->
            <div class="col-md-8">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                    <h5 class="fw-bold mb-3">Categorías Existentes</h5>
                    <div class="list-group">
                        <div th:each="c : ${categorias}" class="list-group-item p-3 border-0 bg-light rounded-3 mb-2">
                            <h6 class="fw-bold text-dark mb-1" th:text="${c.nombre}">Nombre</h6>
                            <p class="text-muted mb-0 small" th:text="${c.descripcion}">Descripción</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
