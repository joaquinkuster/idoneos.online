<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Header -->
<div class="bg-dark text-white py-4 mb-4">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
            <h1 class="fw-bold mb-1"><i class="fa-solid fa-clipboard-list text-warning me-2"></i>Log de Auditoría de Operaciones</h1>
            <small class="text-white-50">Trazabilidad en tiempo real interceptada con Spring AOP</small>
        </div>
        <a th:href="@{/admin/panel}" class="btn btn-outline-light rounded-pill">Volver al Panel Admin</a>
    </div>
</div>

<div class="container pb-5">

    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th># ID</th>
                            <th>Fecha y Hora</th>
                            <th>Usuario Responsable</th>
                            <th>Acción</th>
                            <th>Entidad Afectada</th>
                            <th>ID Registro Afectado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="r : ${registros}">
                            <td class="fw-bold" th:text="${r.id}">ID</td>
                            <td th:text="${#temporals.format(r.fechaHora, 'dd/MM/yyyy HH:mm:ss')}">Fecha</td>
                            <td>
                                <span th:if="${r.usuario != null}" th:text="${r.usuario.nombreCompleto + ' (' + r.usuario.correo + ')'}">Usuario</span>
                                <span th:unless="${r.usuario != null}" class="text-muted fst-italic">Sistema / Anónimo</span>
                            </td>
                            <td>
                                <span class="badge rounded-pill"
                                      th:classappend="${r.tipoAccion.nombre == 'Crear'} ? 'bg-success' : (${r.tipoAccion.nombre == 'Modificar'} ? 'bg-warning text-dark' : 'bg-danger')"
                                      th:text="${r.tipoAccion.nombre}">Acción</span>
                            </td>
                            <td class="fw-semibold text-primary" th:text="${r.entidadAfectada}">Entidad</td>
                            <td th:text="${r.idAfectado}">0</td>
                        </tr>
                        <tr th:if="${registros.isEmpty()}">
                            <td colspan="6" class="text-center text-muted fst-italic py-4">No hay registros de auditoría aún.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
