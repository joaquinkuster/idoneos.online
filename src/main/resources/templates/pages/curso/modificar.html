<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
<!-- Ventana de modificación de un curso. -->
<div th:fragment="modal(curso, bloqueado)" class="modal fade pn-modal" th:id="'modalModificarCurso' + ${curso.idCurso}" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="pn-modal-cabecera">
                <h3 class="pn-modal-titulo">Editar curso</h3>
                <button type="button" class="pn-modal-cerrar" data-bs-dismiss="modal" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="pn-modal-cuerpo">
                <th:block th:replace="~{pages/curso/formulario :: formulario(${curso}, ${bloqueado})}"></th:block>
            </div>
        </div>
    </div>
</div>
</body>
</html>
