<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light d-flex flex-column min-vh-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-lock fa-3x text-success mb-2"></i>
                        <h3 class="fw-bold">Restablecer Contraseña</h3>
                        <p class="text-muted small">Ingresá tu nueva contraseña para actualizar tu cuenta.</p>
                    </div>

                    <form th:action="@{/resetear-contrasena}" method="post">
                        <input type="hidden" name="token" th:value="${token}">

                        <div class="mb-4">
                            <label class="form-label fw-bold">Nueva Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" name="nuevaContrasena" class="form-control border-start-0 ps-0" placeholder="••••••••" required minlength="6">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 fw-bold rounded-pill py-2 mb-3">
                            <i class="fa-solid fa-check-circle me-2"></i>Cambiar Contraseña
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/login}" class="text-decoration-none small text-muted">
                            <i class="fa-solid fa-arrow-left me-1"></i>Cancelar y Volver
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
