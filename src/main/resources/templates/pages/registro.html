<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-dark text-white text-center py-4">
                        <i class="fa-solid fa-user-plus text-primary display-6 mb-2"></i>
                        <h3 class="fw-bold mb-0">Crear Cuenta Alumno</h3>
                        <small class="text-white-50">Accede al catálogo completo de Idóneos Online</small>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <form th:action="@{/registro}" method="post">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="nombre" class="form-label fw-bold">Nombre</label>
                                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Juan" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="apellido" class="form-label fw-bold">Apellido</label>
                                    <input type="text" class="form-control" id="apellido" name="apellido" placeholder="Pérez" required>
                                </div>
                                <div class="col-12">
                                    <label for="correo" class="form-label fw-bold">Correo Electrónico</label>
                                    <input type="email" class="form-control" id="correo" name="correo" placeholder="alumno@ejemplo.com" required>
                                </div>
                                <div class="col-12">
                                    <label for="password" class="form-label fw-bold">Contraseña</label>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mt-4 py-2 rounded-pill fw-bold">Registrarme</button>
                        </form>

                        <hr class="my-4">

                        <p class="text-center text-muted mb-0">
                            ¿Ya tienes cuenta? <a th:href="@{/login}" class="text-primary fw-bold text-decoration-none">Iniciar Sesión</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
