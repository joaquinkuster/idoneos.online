<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
<!-- Ventana de modificación. -->
    <div th:fragment="modal(c)" class="modal fade pn-modal" th:id="'modalModificarClase' + ${c.idClaseEnVivo}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="pn-modal-cabecera">
                    <h3 class="pn-modal-titulo">Editar clase en vivo</h3>
                    <button type="button" class="pn-modal-cerrar" data-bs-dismiss="modal" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="pn-modal-cuerpo">
                    <th:block th:replace="~{pages/claseEnVivo/formulario :: formulario(${c})}"></th:block>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
