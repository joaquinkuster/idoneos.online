<!-- Formulario por pasos para programar (clase == null) o modificar una clase en vivo. -->
<form th:fragment="formulario(clase)"
      th:action="@{${clase == null ? '/claseEnVivo/registrar' : '/claseEnVivo/modificar/' + clase.idClaseEnVivo}}"
      method="post" class="form-ajax" data-validar data-pasos data-resumen="Clase en vivo" data-clase-formulario
      data-contexto='[{"etiqueta":"Curso","atributoForm":"data-ctx-curso"},{"etiqueta":"Cohorte","campo":"idCohorte","atributo":"data-cohorte"},{"etiqueta":"Cohorte","atributoForm":"data-ctx-cohorte"}]'
      th:attr="data-modo=${clase == null ? 'alta' : 'modificacion'}, data-resumen-nuevo=${clase == null ? 'nueva' : null}, data-resumen-titulo=${clase != null ? '(' + clase.titulo + ')' : null}, data-ctx-curso=${clase != null ? clase.cohorte.curso.nombre : curso.nombre}, data-ctx-cohorte=${clase != null ? clase.cohorte.mesAnio : null}"
      novalidate>

    <div class="pn-pasos pn-pasos-nombrados">
        <span class="pn-pasos-item"><span class="pn-pasos-punto">1</span><span class="pn-pasos-nombre">Datos</span></span><span class="pn-pasos-linea"></span>
        <span class="pn-pasos-item"><span class="pn-pasos-punto">2</span><span class="pn-pasos-nombre">Resumen</span></span>
    </div>

    <!-- Paso 1: cohorte, tema, título y horario -->
    <div class="pn-paso" data-grupo="Datos">
        <div class="pn-seccion-titulo">
            <h4>Datos de la clase</h4>
            <p>Cohorte, tema, título y horario de la transmisión</p>
        </div>
        <div class="row g-3">
            <div class="col-md-6 pn-campo" th:if="${clase == null}" data-resumen-omitir>
                <label class="pn-etiqueta">Cohorte <span class="pn-obligatorio">*</span></label>
                <select name="idCohorte" class="pn-input" required data-buscable data-clase-cohorte
                        data-mensaje-obligatorio="Debe seleccionar la cohorte.">
                    <option value="">Seleccionar cohorte</option>
                    <option th:each="co : ${cohortes}" th:value="${co.idCohorte}" th:text="${co.mesAnio + ' (' + co.estado + ')'}"
                            th:attr="data-cohorte=${co.mesAnio}, data-inicio=${#temporals.format(co.fechaInicioDictado, 'dd/MM/yyyy')}, data-fin=${#temporals.format(co.fechaFinDictado != null ? co.fechaFinDictado : co.fechaFinInscripcion.plusDays(co.accesoDias), 'dd/MM/yyyy')}">Abril 2026</option>
                </select>
                <div class="pn-ayuda-error"></div>
            </div>
            <div class="col-md-6 pn-campo" th:if="${clase == null}">
                <label class="pn-etiqueta">Tema <span class="pn-obligatorio">*</span></label>
                <select name="idTema" class="pn-input" required data-buscable data-mensaje-obligatorio="Debe seleccionar el tema.">
                    <option value="">Seleccionar tema</option>
                    <option th:each="uc : ${temas}" th:value="${uc.tema.idTema}" th:text="${uc.tema.titulo}">Introducción</option>
                </select>
                <div class="pn-ayuda-error"></div>
            </div>
            <div class="col-md-6 pn-campo" th:if="${clase != null}" data-resumen-omitir>
                <label class="pn-etiqueta">Cohorte</label>
                <input type="text" class="pn-input pn-bloqueado" readonly tabindex="-1" th:value="${clase.cohorte.etiqueta}">
            </div>
            <div class="col-md-6 pn-campo" th:if="${clase != null}">
                <label class="pn-etiqueta">Tema</label>
                <input type="text" class="pn-input pn-bloqueado" readonly tabindex="-1" th:value="${clase.tema.titulo}">
            </div>
            <div class="col-12 pn-campo">
                <div class="pn-etiqueta-fila">
                    <label class="pn-etiqueta">Título <span class="pn-obligatorio">*</span></label>
                    <span class="pn-contador" th:text="${clase != null ? #strings.length(clase.titulo) + ' / 50' : '0 / 50'}">0 / 50</span>
                </div>
                <input type="text" name="titulo" class="pn-input" maxlength="50" placeholder="Título de la clase" data-contador required
                       th:value="${clase != null ? clase.titulo : ''}" data-mensaje-obligatorio="Debe completar el título.">
                <div class="pn-ayuda-error"></div>
            </div>
            <div class="col-md-6 pn-campo">
                <label class="pn-etiqueta">Fecha y hora de inicio <span class="pn-obligatorio">*</span></label>
                <input type="datetime-local" name="fechaHoraInicio" class="pn-input" required
                       th:value="${clase != null ? #temporals.format(clase.fechaHoraInicio, 'yyyy-MM-dd') + 'T' + #temporals.format(clase.fechaHoraInicio, 'HH:mm') : ''}"
                       data-mensaje-obligatorio="Debe completar la fecha y hora de inicio.">
                <small class="text-muted" data-clase-dictado
                       th:text="${clase != null ? 'Dictado de la cohorte: del ' + #temporals.format(clase.cohorte.fechaInicioDictado, 'dd/MM/yyyy') + ' al ' + #temporals.format(clase.cohorte.fechaFinDictado != null ? clase.cohorte.fechaFinDictado : clase.cohorte.fechaFinInscripcion.plusDays(clase.cohorte.accesoDias), 'dd/MM/yyyy') + '.' : 'Debe estar dentro del período de dictado de la cohorte.'}">Debe estar dentro del período de dictado de la cohorte.</small>
                <div class="pn-ayuda-error"></div>
            </div>
            <div class="col-md-6 pn-campo">
                <label class="pn-etiqueta">Fecha y hora de cierre <span class="pn-obligatorio">*</span></label>
                <input type="datetime-local" name="fechaHoraCierre" class="pn-input" required
                       th:value="${clase != null ? #temporals.format(clase.fechaHoraCierre, 'yyyy-MM-dd') + 'T' + #temporals.format(clase.fechaHoraCierre, 'HH:mm') : ''}"
                       data-mensaje-obligatorio="Debe completar la fecha y hora de cierre.">
                <div class="pn-ayuda-error"></div>
            </div>
        </div>
    </div>

    <!-- Paso 2: resumen -->
    <div class="pn-paso">
        <div class="pn-seccion-titulo">
            <h4>Resumen</h4>
            <p th:text="${clase == null ? 'Revisá los datos antes de guardar' : 'Estos son los cambios que se van a guardar'}">Revisá los datos antes de guardar</p>
        </div>
        <div class="pn-arbol" data-resumen-arbol></div>
    </div>

    <div class="pn-modal-pie">
        <button type="button" class="pn-btn pn-btn-contorno pn-pie-izquierda" data-paso-anterior>Anterior</button>
        <button type="button" class="pn-btn pn-btn-secundario" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="pn-btn pn-btn-primario" data-paso-siguiente>Siguiente</button>
        <button type="submit" class="pn-btn pn-btn-primario d-none" data-paso-guardar
                th:text="${clase == null ? 'Confirmar y guardar' : 'Confirmar cambios'}">Confirmar y guardar</button>
    </div>
</form>
