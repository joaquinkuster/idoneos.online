<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="bg-dark text-white py-4 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <span class="badge bg-success px-3 py-2 rounded-pill mb-2">Inscripto</span>
                <h1 class="fw-bold mb-0" th:text="${curso.nombre}">Curso</h1>
            </div>
            <a th:href="@{/cursos}" class="btn btn-outline-light rounded-pill"><i class="fa-solid fa-arrow-left me-2"></i>Volver al Catálogo</a>
        </div>
    </div>

    <div class="container mb-5">
        <div class="row g-4">
            <!-- Menú de Unidades -->
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-4 p-3">
                    <h5 class="fw-bold mb-3 px-2">Unidades Secuenciales</h5>
                    <div class="list-group list-group-flush">
                        <th:block th:each="unidad : ${curso.unidades}">
                            <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center rounded-3 mb-2 border-0 bg-white shadow-sm p-3">
                                <div>
                                    <span class="badge bg-primary rounded-pill mb-1" th:text="'Unidad ' + ${unidad.numeroOrden}">U1</span>
                                    <h6 class="fw-bold text-dark mb-0" th:text="${unidad.titulo}">Título</h6>
                                </div>
                                <i class="fa-solid fa-circle-check text-success fs-5"></i>
                            </div>
                        </th:block>
                    </div>
                </div>
            </div>

            <!-- Contenido de la Unidad -->
            <div class="col-md-8">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                    <div th:if="${!curso.unidades.isEmpty()}">
                        <span class="badge bg-primary px-3 py-2 rounded-pill mb-2" th:text="'Unidad ' + ${curso.unidades[0].numeroOrden}">U1</span>
                        <h2 class="fw-bold mb-3" th:text="${curso.unidades[0].titulo}">Título de la primera unidad</h2>
                        <p class="lead text-muted mb-4" th:text="${curso.unidades[0].descripcion}">Descripción...</p>

                        <hr class="my-4">

                        <h5 class="fw-bold mb-3"><i class="fa-solid fa-folder-open text-primary me-2"></i>Material Didáctico</h5>
                        <div class="list-group">
                            <div th:each="material : ${curso.unidades[0].materiales}" class="list-group-item d-flex justify-content-between align-items-center p-3 border-0 bg-light rounded-3 mb-2">
                                <div class="d-flex align-items-center gap-3">
                                    <i th:if="${material.tipo.name() == 'GRABACION'}" class="fa-solid fa-video text-danger fs-4"></i>
                                    <i th:if="${material.tipo.name() == 'BIBLIOGRAFIA'}" class="fa-solid fa-file-pdf text-danger fs-4"></i>
                                    <i th:if="${material.tipo.name() == 'GLOSARIO'}" class="fa-solid fa-book text-info fs-4"></i>
                                    <div>
                                        <h6 class="fw-bold mb-0" th:text="${material.titulo}">Material</h6>
                                        <small class="text-muted" th:text="${material.tipo}">TIPO</small>
                                    </div>
                                </div>
                                <a href="#" class="btn btn-outline-primary btn-sm rounded-pill px-3">Ver / Descargar</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
