<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Header -->
<div class="bg-dark text-white py-4 mb-4">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
            <h1 class="font-serif fw-bold mb-1"><i class="fa-solid fa-book-open text-gold me-2"></i>Mis Cursos Inscriptos</h1>
            <small class="text-white-50">Accedé al temario y avance de tus cursadas activas</small>
        </div>
        <a th:href="@{/cursos}" class="btn btn-outline-light rounded-pill"><i class="fa-solid fa-plus me-2"></i>Explorar Más Cursos</a>
    </div>
</div>

<div class="container pb-5">
    <div class="row g-4">
        <div th:each="curso : ${misCursos}" class="col-md-4">
            <div class="idn-card h-100 p-4 d-flex flex-column justify-content-between">
                <div>
                    <span class="badge bg-gold-soft rounded-pill px-3 py-2 mb-3" th:text="${curso.categoria.nombre}">Categoría</span>
                    <h3 class="font-serif fs-4 fw-bold text-navy mb-2" th:text="${curso.nombre}">Nombre</h3>
                    <p class="small text-muted mb-3" th:text="${#strings.abbreviate(curso.descripcion, 100)}">Descripción</p>
                </div>
                <div class="pt-3 border-top d-flex justify-content-between align-items-center">
                    <span class="small text-muted"><i class="fa-solid fa-layer-group me-1"></i><span th:text="${curso.unidades.size()}">0</span> unid.</span>
                    <a th:href="@{'/cursos/' + ${curso.id} + '/mi-cursada'}" class="btn btn-sm px-4 rounded-pill idn-btn-gold">
                        <i class="fa-solid fa-circle-play me-1"></i>Ir a la Cursada
                    </a>
                </div>
            </div>
        </div>

        <div th:if="${misCursos.isEmpty()}" class="col-12 text-center py-5">
            <i class="fa-solid fa-graduation-cap fa-4x text-muted mb-3"></i>
            <h4 class="font-serif text-muted">Aún no estás inscripto a ningún curso.</h4>
            <p class="text-muted">Explorá nuestro catálogo para empezar a capacitarte.</p>
            <a th:href="@{/cursos}" class="btn idn-btn-gold rounded-pill px-4 fw-bold mt-2">Ir al Catálogo de Cursos</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
