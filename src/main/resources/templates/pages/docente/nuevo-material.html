<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="bg-dark text-white py-4 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="fw-bold mb-0">Cargar Material Didáctico</h1>
            <a th:href="@{'/docente/curso/' + ${unidad.curso.id} + '/gestionar'}" class="btn btn-outline-light rounded-pill">Volver</a>
        </div>
    </div>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                    <div class="mb-4">
                        <h5 class="fw-bold mb-1">Unidad: <span class="text-primary" th:text="${unidad.titulo}">Nombre</span></h5>
                        <small class="text-muted" th:text="'Curso: ' + ${unidad.curso.nombre}">Curso</small>
                    </div>
                    <form th:action="@{'/docente/unidad/' + ${unidad.id} + '/material/guardar'}" method="post">
                        <div class="mb-3">
                            <label for="tipo" class="form-label fw-bold">Tipo de Material</label>
                            <select class="form-select" id="tipo" name="tipo" required>
                                <option th:each="t : ${tiposMaterial}" th:value="${t}" th:text="${t}">TIPO</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="titulo" class="form-label fw-bold">Título del Material</label>
                            <input type="text" class="form-control" id="titulo" name="titulo"
                                   placeholder="Ej: Clase Grabada Unidad 1 - Introducción" required>
                        </div>
                        <div class="mb-4">
                            <label for="ruta" class="form-label fw-bold">URL o Ruta del Archivo</label>
                            <input type="text" class="form-control" id="ruta" name="ruta"
                                   placeholder="https://... o /uploads/archivo.pdf" required>
                            <small class="text-muted">Puede ser una URL de YouTube, Google Drive, o una ruta local del servidor.</small>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold">
                            <i class="fa-solid fa-upload me-2"></i>Guardar Material
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
