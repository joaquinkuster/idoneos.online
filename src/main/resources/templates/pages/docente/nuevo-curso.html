<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body>
    <header th:replace="~{fragments/navbar :: navbar}"></header>

    <div class="bg-navy py-4 mb-4 text-white idn-fade">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h1 class="font-serif fw-bold mb-0 text-white"><i class="fa-solid fa-plus-circle me-2 text-gold"></i>Registrar Nuevo Curso</h1>
                <small class="text-white-50">Crea la oferta formativa y luego diagramarás sus programas y lecciones.</small>
            </div>
            <a th:href="@{/docente}" class="btn btn-outline-light rounded-pill">Volver al Panel</a>
        </div>
    </div>

    <main class="container mb-5 idn-fade">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Mensajes Flash -->
                <div th:if="${mensaje != null}" class="alert alert-danger alert-dismissible fade show mb-4 border-0 shadow-sm rounded-3" role="alert">
                    <i class="fa-solid fa-circle-exclamation me-2"></i>
                    <span th:text="${mensaje}">Mensaje</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card idn-card border-0 shadow-sm p-4 p-md-5 bg-white">
                    <form th:action="@{/docente/curso/guardar}" method="post">
                        <div class="mb-3">
                            <label for="nombre" class="form-label small fw-bold text-navy">Nombre del Curso *</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" required placeholder="Ej: Especialización en Renta Fija y Curva de Tasas">
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="categoriaId" class="form-label small fw-bold text-navy">Categoría Temática *</label>
                                <select class="form-select" id="categoriaId" name="categoriaId" required>
                                    <option value="" disabled selected>-- Seleccione categoría --</option>
                                    <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}">Categoría</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="nivelId" class="form-label small fw-bold text-navy">Nivel de Dificultad</label>
                                <select class="form-select" id="nivelId" name="nivelId">
                                    <option value="">-- Seleccione nivel --</option>
                                    <option th:each="n : ${niveles}" th:value="${n.id}" th:text="${n.nombre}">Inicial / Intermedio / Avanzado</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="precio" class="form-label small fw-bold text-navy">Arancel Base ($ARS - 0 para Curso Gratuito) *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">$</span>
                                <input type="number" step="100" min="0" class="form-control" id="precio" name="precio" value="0" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="descripcion" class="form-label small fw-bold text-navy">Descripción y Objetivos Principales *</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="4" required placeholder="Resumen del enfoque pedagógico, temas regulatorios CNV y metodología..."></textarea>
                        </div>
                        <button type="submit" class="btn idn-btn-gold w-100 py-3 fw-bold shadow">
                            <i class="fa-solid fa-cloud-arrow-up me-2"></i> Crear y Comenzar a Cargar Programas
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
