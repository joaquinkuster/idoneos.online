<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="bg-dark text-white py-4 mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="fw-bold mb-0">Crear Nuevo Curso</h1>
            <a th:href="@{/docente}" class="btn btn-outline-light rounded-pill">Volver</a>
        </div>
    </div>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                    <form th:action="@{/docente/curso/guardar}" method="post">
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-bold">Nombre del Curso</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" required placeholder="Ej: Introducción a la Macroeconómia">
                        </div>
                        <div class="mb-3">
                            <label for="categoriaId" class="form-label fw-bold">Categoría Académica</label>
                            <select class="form-select" id="categoriaId" name="categoriaId" required>
                                <option value="" disabled selected>Seleccione una categoría</option>
                                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}">Categoría</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="precio" class="form-label fw-bold">Arancel ($ARS - 0 para Gratuito)</label>
                            <input type="number" step="1000" min="0" class="form-control" id="precio" name="precio" value="0" required>
                        </div>
                        <div class="mb-4">
                            <label for="descripcion" class="form-label fw-bold">Descripción del Programa</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" rows="5" required placeholder="Detalla los objetivos académicos del curso..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-3 rounded-pill fw-bold">Publicar Curso</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
