<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="bg-dark text-white py-4 mb-4">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h1 class="fw-bold mb-1" th:text="'Gestionar: ' + ${curso.nombre}">Gestionar Curso</h1>
                <small class="text-white-50" th:text="${curso.categoria.nombre + ' · ' + curso.unidades.size() + ' unidades'}">Categoría</small>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{'/docente/curso/' + ${curso.id} + '/unidad/nueva'}" class="btn btn-success rounded-pill fw-bold">
                    <i class="fa-solid fa-plus me-2"></i>Nueva Unidad
                </a>
                <a th:href="@{/docente}" class="btn btn-outline-light rounded-pill">Volver</a>
            </div>
        </div>
    </div>

    <div class="container mb-5">
        <div th:if="${mensaje != null}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${unidades.isEmpty()}" class="text-center py-5">
            <i class="fa-solid fa-list-ol display-2 text-muted mb-3"></i>
            <h4 class="text-muted mb-3">Este curso no tiene unidades aún.</h4>
            <a th:href="@{'/docente/curso/' + ${curso.id} + '/unidad/nueva'}" class="btn btn-success rounded-pill px-4 fw-bold">
                <i class="fa-solid fa-plus me-2"></i>Crear Primera Unidad
            </a>
        </div>

        <div th:each="unidad : ${unidades}" class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-header bg-white py-3 px-4 d-flex justify-content-between align-items-center border-bottom">
                <div>
                    <span class="badge bg-primary rounded-pill me-2" th:text="'Unidad ' + ${unidad.numeroOrden}">U1</span>
                    <strong th:text="${unidad.titulo}">Título</strong>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{'/docente/unidad/' + ${unidad.id} + '/material/nuevo'}" class="btn btn-outline-primary btn-sm rounded-pill">
                        <i class="fa-solid fa-plus me-1"></i>Material
                    </a>
                    <form th:action="@{'/docente/unidad/' + ${unidad.id} + '/eliminar'}" method="post" class="d-inline"
                          onsubmit="return confirm('¿Eliminar esta unidad y todo su material?')">
                        <input type="hidden" name="cursoId" th:value="${curso.id}">
                        <button class="btn btn-outline-danger btn-sm rounded-pill" type="submit">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </form>
                </div>
            </div>

            <div class="card-body p-4">
                <p class="text-muted mb-3" th:text="${unidad.descripcion}">Descripción...</p>

                <!-- Materiales de esta unidad -->
                <h6 class="fw-bold mb-3"><i class="fa-solid fa-folder-open text-primary me-2"></i>Materiales</h6>
                <div th:if="${unidad.materiales.isEmpty()}" class="text-muted fst-italic small">Sin materiales cargados.</div>
                <div class="list-group gap-2">
                    <div th:each="m : ${unidad.materiales}" th:if="${!m.getBaja()}"
                         class="list-group-item d-flex justify-content-between align-items-center p-3 border-0 bg-light rounded-3">
                        <div class="d-flex align-items-center gap-3">
                            <i th:if="${m.tipo.name() == 'GRABACION'}" class="fa-solid fa-video text-danger fs-5"></i>
                            <i th:if="${m.tipo.name() == 'BIBLIOGRAFIA'}" class="fa-solid fa-file-pdf text-danger fs-5"></i>
                            <i th:if="${m.tipo.name() == 'PRESENTACION'}" class="fa-solid fa-file-powerpoint text-warning fs-5"></i>
                            <i th:if="${m.tipo.name() == 'RESUMEN'}" class="fa-solid fa-file-lines text-info fs-5"></i>
                            <i th:if="${m.tipo.name() == 'GLOSARIO'}" class="fa-solid fa-book text-success fs-5"></i>
                            <div>
                                <h6 class="fw-bold mb-0 small" th:text="${m.titulo}">Material</h6>
                                <small class="text-muted" th:text="${m.tipo + (m.publicado ? '' : ' · Oculto')}">TIPO</small>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <a th:href="${m.ruta}" target="_blank" class="btn btn-outline-secondary btn-sm rounded-pill">Ver</a>
                            <form th:action="@{'/docente/material/' + ${m.id} + '/eliminar'}" method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar este material?')">
                                <input type="hidden" name="cursoId" th:value="${curso.id}">
                                <button class="btn btn-outline-danger btn-sm rounded-pill" type="submit"><i class="fa-solid fa-trash"></i></button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
