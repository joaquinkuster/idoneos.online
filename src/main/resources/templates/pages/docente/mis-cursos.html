<!-- Actualización del panel del docente con link a gestionar -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="bg-dark text-white py-4 mb-4">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h1 class="fw-bold mb-0"><i class="fa-solid fa-chalkboard-user text-success me-2"></i>Panel Docente</h1>
                <p class="text-white-50 mb-0" th:text="'Bienvenido/a, ' + ${usuario.nombreCompleto}">Docente</p>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <a th:href="@{/clase-vivo/docente}" class="btn btn-outline-light rounded-pill fw-bold">
                    <i class="fa-solid fa-video me-2"></i>Clases en Vivo
                </a>
                <a th:href="@{/clon-ia/docente}" class="btn btn-outline-warning rounded-pill fw-bold">
                    <i class="fa-solid fa-robot me-2"></i>Clon IA
                </a>
                <a th:href="@{/docente/curso/nuevo}" class="btn btn-success rounded-pill fw-bold">
                    <i class="fa-solid fa-plus me-2"></i>Crear Nuevo Curso
                </a>
            </div>
        </div>
    </div>

    <div class="container mb-5">
        <div th:if="${mensaje != null}" class="alert alert-success alert-dismissible fade show mb-4" role="alert">
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <h4 class="fw-bold mb-4">Mis Cursos</h4>

        <div class="row g-4">
            <div th:if="${cursos.isEmpty()}" class="col-12 text-center py-5">
                <i class="fa-solid fa-folder-open display-1 text-muted mb-3"></i>
                <h4 class="text-muted">No tenés cursos creados todavía.</h4>
            </div>

            <div th:each="curso : ${cursos}" class="col-md-4">
                <div class="card card-curso h-100 border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="p-4 text-white" style="background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);">
                        <span class="badge bg-primary rounded-pill mb-2" th:text="${curso.categoria.nombre}">Cat</span>
                        <h5 class="fw-bold mb-1" th:text="${curso.nombre}">Curso</h5>
                        <small class="text-white-50" th:text="${curso.unidades.size() + ' unidades'}">Unidades</small>
                    </div>
                    <div class="card-body d-flex flex-column p-4">
                        <div class="d-flex gap-2 mt-auto">
                            <a th:href="@{'/docente/curso/' + ${curso.id} + '/gestionar'}" class="btn btn-outline-primary btn-sm rounded-pill flex-fill">
                                <i class="fa-solid fa-pen-to-square me-1"></i>Gestionar
                            </a>
                            <a th:href="@{'/cursos/' + ${curso.id}}" class="btn btn-outline-secondary btn-sm rounded-pill">
                                <i class="fa-solid fa-eye"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
