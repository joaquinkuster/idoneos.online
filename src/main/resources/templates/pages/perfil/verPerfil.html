<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body>
    <header th:replace="~{fragments/navbar :: navbar}"></header>

    <div class="bg-navy py-5 mb-4 text-white idn-fade">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <div class="d-flex align-items-center gap-2 mb-2 text-gold small fw-bold" style="letter-spacing: 0.12em;">
                    <i class="fa-solid fa-user-gear"></i> CUENTA Y SEGURIDAD · IDÓNEOS ONLINE
                </div>
                <h1 class="font-serif display-5 fw-bold text-white mb-0">Mi Perfil</h1>
                <p class="text-white-50 lead mb-0">Información personal, correo electrónico y configuración de acceso.</p>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/usuario/sesiones}" class="btn btn-outline-light rounded-pill">
                    <i class="fa-solid fa-shield-halved me-1"></i> Sesiones Activas
                </a>
            </div>
        </div>
    </div>

    <main class="container mb-5 idn-fade">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <!-- Mensajes Flash -->
                <div th:if="${mensaje != null}" class="alert alert-info alert-dismissible fade show mb-4 border-0 shadow-sm rounded-3" role="alert">
                    <i class="fa-solid fa-circle-info me-2 text-primary"></i>
                    <span th:text="${mensaje}">Mensaje</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card idn-card border-0 shadow-sm p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="rounded-circle bg-navy text-white fw-bold d-inline-flex align-items-center justify-content-center mb-3 shadow"
                             style="width: 76px; height: 76px; font-size: 28px;"
                             th:text="${#strings.substring(usuario.nombre, 0, 1)}">U</div>
                        <h3 class="font-serif fw-bold text-navy mb-1" 
                            th:text="${usuario.nombre + ' ' + (usuario.apellido != null ? usuario.apellido : '')}">Nombre Usuario</h3>
                        <span class="badge bg-gold text-navy rounded-pill px-3 py-1 fw-bold" 
                              th:text="${usuario.rol != null ? usuario.rol.nombre : 'Alumno'}">ROL</span>
                    </div>

                    <form th:action="@{/usuario/modificar/{id}(id=${usuario.id})}" method="post">
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label for="nombre" class="form-label small fw-bold text-navy">Nombre *</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" th:value="${usuario.nombre}" required>
                            </div>
                            <div class="col-6">
                                <label for="apellido" class="form-label small fw-bold text-navy">Apellido *</label>
                                <input type="text" class="form-control" id="apellido" name="apellido" th:value="${usuario.apellido}" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="correo" class="form-label small fw-bold text-navy">Correo Electrónico *</label>
                            <input type="email" class="form-control" id="correo" name="correo" th:value="${usuario.correo}" required>
                        </div>

                        <button type="submit" class="btn idn-btn-gold w-100 py-3 fw-bold shadow mb-3">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Guardar Cambios en Mi Perfil
                        </button>
                    </form>

                    <hr class="my-4">

                    <div class="d-flex flex-column flex-sm-row gap-2">
                        <a th:href="@{/usuario/cambiarContrasena}" class="btn btn-outline-secondary rounded-pill flex-fill">
                            <i class="fa-solid fa-key me-1"></i> Cambiar Contraseña
                        </a>
                        <a th:href="@{/usuario/sesiones}" class="btn btn-outline-primary rounded-pill flex-fill">
                            <i class="fa-solid fa-desktop me-1"></i> Dispositivos y Sesiones
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
