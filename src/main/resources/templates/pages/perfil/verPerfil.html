<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-user-circle text-primary display-3 mb-2"></i>
                        <h3 class="fw-bold mb-0" th:text="${usuario.nombreCompleto}">Nombre Usuario</h3>
                        <span class="badge bg-secondary rounded-pill uppercase px-3 py-1 mt-1" th:text="${usuario.rol}">ROL</span>
                    </div>

                    <div th:if="${mensaje != null}" class="alert alert-info alert-dismissible fade show mb-4" role="alert">
                        <span th:text="${mensaje}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{'/usuario/modificar/' + ${usuario.id}}" method="post">
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-bold">Nombre</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" th:value="${usuario.nombre}" required>
                        </div>
                        <div class="mb-3">
                            <label for="apellido" class="form-label fw-bold">Apellido</label>
                            <input type="text" class="form-control" id="apellido" name="apellido" th:value="${usuario.apellido}" required>
                        </div>
                        <div class="mb-4">
                            <label for="correo" class="form-label fw-bold">Correo Electrónico</label>
                            <input type="email" class="form-control" id="correo" name="correo" th:value="${usuario.correo}" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold mb-3">Guardar Cambios</button>
                    </form>

                    <hr class="my-4">

                    <a th:href="@{/usuario/cambiarContrasena}" class="btn btn-outline-secondary w-100 rounded-pill"><i class="fa-solid fa-key me-2"></i>Cambiar Contraseña</a>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
