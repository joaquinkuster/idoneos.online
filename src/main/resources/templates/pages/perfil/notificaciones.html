<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Header -->
<div class="bg-dark text-white py-4 mb-4">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
        <div>
            <h1 class="font-serif fw-bold mb-1"><i class="fa-solid fa-bell text-gold me-2"></i>Mis Notificaciones</h1>
            <small class="text-white-50">Historial de avisos y novedades de tu cuenta</small>
        </div>
        <a th:href="@{/usuario/verPerfil}" class="btn btn-outline-light rounded-pill">Volver al Perfil</a>
    </div>
</div>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <div class="list-group list-group-flush gap-2">
                        <div th:each="n : ${notificaciones}" class="list-group-item border-0 bg-light p-3 rounded-3 mb-2">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <strong class="text-navy" th:text="${n.titulo}">Título</strong>
                                <small class="text-muted" th:text="${#temporals.format(n.fecha, 'dd/MM/yyyy HH:mm')}">Fecha</small>
                            </div>
                            <p class="mb-0 text-secondary small" th:text="${n.mensaje}">Mensaje...</p>
                        </div>

                        <div th:if="${notificaciones.isEmpty()}" class="text-center text-muted py-5">
                            <i class="fa-solid fa-bell-slash fa-3x mb-3"></i>
                            <p class="mb-0">No tenés notificaciones pendientes.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
