<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body>
    <header th:replace="~{fragments/navbar :: navbar}"></header>

    <div class="bg-navy py-5 mb-4 text-white idn-fade">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <div class="d-flex align-items-center gap-2 mb-2 text-gold small fw-bold" style="letter-spacing: 0.12em;">
                    <i class="fa-solid fa-lock"></i> SEGURIDAD DE LA CUENTA · IDÓNEOS ONLINE
                </div>
                <h1 class="font-serif display-5 fw-bold text-white mb-0">Cambiar Contraseña</h1>
                <p class="text-white-50 lead mb-0">Actualiza tu clave de acceso para mantener protegida tu cuenta.</p>
            </div>
            <a th:href="@{/usuario/verPerfil}" class="btn btn-outline-light rounded-pill">Volver al Perfil</a>
        </div>
    </div>

    <main class="container mb-5 idn-fade">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <!-- Mensajes Flash -->
                <div th:if="${mensaje != null}" class="alert alert-info alert-dismissible fade show mb-4 border-0 shadow-sm rounded-3" role="alert">
                    <i class="fa-solid fa-circle-info me-2 text-primary"></i>
                    <span th:text="${mensaje}">Mensaje</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card idn-card border-0 shadow-sm p-4 p-md-5 bg-white">
                    <h4 class="font-serif fw-bold text-navy mb-4 text-center">Modificar Clave de Acceso</h4>

                    <form th:action="@{/usuario/cambiarContrasena/{id}(id=${usuario.id})}" method="post">
                        <div class="mb-3">
                            <label for="actual" class="form-label small fw-bold text-navy">Contraseña Actual *</label>
                            <input type="password" class="form-control" id="actual" name="actual" placeholder="••••••••" required>
                        </div>
                        <div class="mb-3">
                            <label for="nueva" class="form-label small fw-bold text-navy">Nueva Contraseña (mínimo 6 caracteres) *</label>
                            <input type="password" class="form-control" id="nueva" name="nueva" placeholder="••••••••" minlength="6" required>
                        </div>
                        <div class="mb-4">
                            <label for="nuevaRepetida" class="form-label small fw-bold text-navy">Confirmar Nueva Contraseña *</label>
                            <input type="password" class="form-control" id="nuevaRepetida" name="nuevaRepetida" placeholder="••••••••" minlength="6" required>
                        </div>
                        <button type="submit" class="btn idn-btn-gold w-100 py-3 fw-bold shadow">
                            <i class="fa-solid fa-check me-2"></i> Actualizar Contraseña
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <a th:href="@{/usuario/verPerfil}" class="text-muted text-decoration-none small">
                            <i class="fa-solid fa-arrow-left me-1"></i> Cancelar y Volver a Mi Perfil
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
