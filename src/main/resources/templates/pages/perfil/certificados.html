<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Header -->
<div class="bg-dark text-white py-4 mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <h1 class="fw-bold mb-1"><i class="fa-solid fa-award text-warning me-2"></i>Mis Certificados y Constancias</h1>
            <small class="text-white-50">CU-46: Diplomas de finalización de cursos aprobados</small>
        </div>
        <a th:href="@{/perfil}" class="btn btn-outline-light rounded-pill">Mi Perfil</a>
    </div>
</div>

<div class="container pb-5">
    <div class="row g-4">
        <div th:each="ins : ${inscripciones}" class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 h-100 p-4 bg-white d-flex flex-column">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <span class="badge bg-primary rounded-pill px-3 py-2" th:text="${ins.curso.categoria.nombre}">Categoría</span>
                    <span th:if="${ins.certificado != null}" class="badge bg-success rounded-pill px-3 py-2"><i class="fa-solid fa-check me-1"></i>Emitido</span>
                    <span th:unless="${ins.certificado != null}" class="badge bg-warning text-dark rounded-pill px-3 py-2"><i class="fa-solid fa-spinner me-1"></i>En cursada</span>
                </div>

                <h4 class="fw-bold text-dark mb-2" th:text="${ins.curso.nombre}">Nombre del Curso</h4>
                <p class="text-muted small mb-3" th:text="${ins.curso.descripcion}">Descripción</p>

                <div class="mt-auto pt-3 border-top d-flex justify-content-between align-items-center">
                    <small class="text-muted" th:text="'Inscripto: ' + ${#temporals.format(ins.fecha, 'dd/MM/yyyy')}">Fecha</small>

                    <a th:href="@{'/certificado/inscripcion/' + ${ins.id}}"
                       class="btn btn-gold fw-bold rounded-pill px-4">
                        <i class="fa-solid fa-file-pdf me-2"></i>Ver Certificado
                    </a>
                </div>
            </div>
        </div>

        <div th:if="${inscripciones.isEmpty()}" class="col-12 text-center py-5 bg-white rounded-4 shadow-sm">
            <i class="fa-solid fa-graduation-cap fa-3x text-muted mb-3"></i>
            <h5 class="fw-bold text-muted">Aún no estás inscripto en ningún curso.</h5>
            <a th:href="@{/cursos}" class="btn btn-primary rounded-pill mt-3">Explorar Catálogo de Cursos</a>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
