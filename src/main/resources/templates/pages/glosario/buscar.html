<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <th:block th:replace="~{fragments/head :: recursos}"></th:block>
</head>
<body class="pn-body">
<div class="pn-app" id="pnApp">
    <!-- Menú lateral: el del docente (gestión académica) o, para el administrador, el del panel -->
    <th:block th:replace="~{fragments/menus :: gestionAcademica(${menuActivo}, ${urlBase})}"></th:block>

    <div class="pn-principal">
        <th:block th:if="${esDocente}"><th:block th:replace="~{fragments/panel :: barra(null)}"></th:block></th:block>
        <th:block th:unless="${esDocente}"><th:block th:replace="~{fragments/panel :: barra(null)}"></th:block></th:block>

        <main class="pn-contenido">
            <nav class="ac-migas" aria-label="Ruta de navegación">
                <a th:href="@{/inicio}">Página principal</a>
                <i class="fa-solid fa-chevron-right"></i>
                <a th:href="@{${urlMisCursos}}" th:text="${esAdministrador == true ? 'Cursos' : 'Mis cursos'}">Mis cursos</a>
                <i class="fa-solid fa-chevron-right"></i>
                <a th:href="@{${urlBase}}" th:text="${curso.nombre}">Curso</a>
                <i class="fa-solid fa-chevron-right"></i>
                <strong>Glosarios</strong>
            </nav>

            <div class="pn-encabezado">
                <div>
                    <h1 class="pn-titulo">Glosarios</h1>
                    <p class="pn-subtitulo" th:text="${'Cada unidad de ' + curso.nombre + ' tiene su glosario de términos'}">Cada unidad tiene su glosario</p>
                </div>
            </div>

            <section class="pn-tarjeta" data-tabla>
                <div class="pn-lista-cabecera">
                    <h2 class="pn-lista-titulo">Listado de glosarios</h2>
                </div>

                <!-- Filtros -->
                <form th:action="@{/glosario/buscar}" method="get" class="pn-filtros" data-filtro-front>
                    <input type="hidden" name="cursoId" th:value="${curso.idCurso}">
                    <a th:href="@{/glosario/buscar(cursoId=${curso.idCurso})}" class="pn-btn pn-btn-contorno" hidden>Limpiar</a>
                </form>

                <div class="pn-tabla-contenedor">
                    <table class="pn-tabla">
                        <thead>
                            <tr>
                                <th data-col="Nombre" data-campo="nombre" data-filtro="texto">Nombre</th>
                                <th data-col="Unidad" data-campo="unidad" data-filtro="lista">Unidad</th>
                                <th data-col="Términos" data-campo="terminos" data-filtro="numero">Términos</th>
                                <th data-col="Última actualización" data-campo="ultimaActualizacion" data-filtro="fecha">Última actualización</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="uc : ${unidades}" data-fila data-dependencias="0">
                                <td>
                                    <span class="ac-tipo-celda">
                                        <th:block th:replace="~{fragments/iconoMaterial :: icono('Glosario', 'ac-recurso-icono-chico')}"></th:block>
                                        <span class="pn-celda-principal" th:text="${'Glosario ' + uc.numeroOrden}">Glosario 1</span>
                                    </span>
                                </td>
                                <td><span class="pn-truncar" th:text="${uc.unidad.titulo}">Introducción al mercado</span></td>
                                <td>
                                    <span th:if="${!#lists.isEmpty(uc.unidad.terminosGlosarioOrdenados)}"
                                          th:text="${#lists.size(uc.unidad.terminosGlosarioOrdenados) + (#lists.size(uc.unidad.terminosGlosarioOrdenados) == 1 ? ' término' : ' términos')}">3 términos</span>
                                    <span th:if="${#lists.isEmpty(uc.unidad.terminosGlosarioOrdenados)}" class="pn-celda-secundaria">Sin términos</span>
                                </td>
                                <td th:text="${uc.unidad.ultimaActualizacionGlosario != null ? #temporals.format(uc.unidad.ultimaActualizacionGlosario, 'dd/MM/yyyy') : '-'}">28/08/2026</td>
                                <td>
                                    <div class="pn-acciones">
                                        <a class="pn-btn pn-btn-ver pn-btn-chico" th:href="@{'/glosario/ver/' + ${uc.unidad.idUnidad}}">Ver detalle</a>
                                    </div>
                                </td>
                            </tr>
                            <tr th:replace="~{fragments/vacio :: fila(5, 'fa-spell-check', 'No se encontraron glosarios', 'Ningún glosario coincide con los criterios ingresados.')}"></tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pie: filas por página y paginador -->
                <div class="pn-tabla-pie">
                    <div class="pn-por-pagina">
                        <span>Filas por página:</span>
                        <select data-por-pagina>
                            <option value="10">10</option>
                            <option value="25">25</option>
                            <option value="50">50</option>
                            <option value="0">Todo</option>
                        </select>
                        <span data-rango>0-0 de 0</span>
                    </div>
                    <div class="pn-paginador" data-paginador></div>
                </div>
            </section>
        </main>

        <th:block th:replace="~{fragments/panel :: pie(${esDocente ? 'Gestión académica' : 'Panel del administrador'})}"></th:block>
    </div>
</div>

<th:block th:replace="~{fragments/panel :: scripts}"></th:block>
<script th:src="@{/js/academica.js}"></script>
</body>
</html>
