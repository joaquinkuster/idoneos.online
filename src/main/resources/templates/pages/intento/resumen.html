<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <th:block th:replace="~{fragments/head :: recursos}"></th:block>
</head>
<body class="in-body" id="intento"
      th:attr="data-intento=${intento.idIntentoAutoevaluacion}, data-segundos=${segundosRestantes}, data-libre=${libre},
               data-sin-responder=${sinResponder}, data-url-ficha='/autoevaluacion/ver/' + ${autoevaluacion.idAutoevaluacion}">

    <th:block th:replace="~{fragments/intentoCabecera :: cabecera(${curso}, ${autoevaluacion}, ${segundosRestantes})}"></th:block>

    <main class="in-resumen">
        <section class="in-tarjeta">
            <h1 class="in-resumen-titulo">Resumen del intento</h1>
            <p class="in-resumen-subtitulo">
                Respondiste <strong th:text="${respondidas}">8</strong> de <strong th:text="${total}">10</strong> preguntas.
                <span th:if="${intento.cantidadMarcadas > 0}">Marcaste <strong th:text="${intento.cantidadMarcadas}">1</strong> para revisar.</span>
            </p>
            <table class="in-resumen-tabla">
                <thead>
                    <tr><th>Pregunta</th><th>Estado</th></tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${preguntas}">
                        <td>
                            <a th:if="${libre}" th:href="@{/intento/realizar/{id}(id=${intento.idIntentoAutoevaluacion}, pregunta=${p.orden})}" th:text="${p.orden}">1</a>
                            <span th:unless="${libre}" th:text="${p.orden}">1</span>
                        </td>
                        <td>
                            <span th:text="${p.estaRespondida() ? 'Respuesta guardada' : 'Sin responder'}">Respuesta guardada</span>
                            <span class="pn-insignia pn-insignia-dorada" th:if="${p.marcada}">Marcada</span>
                        </td>
                    </tr>
                </tbody>
            </table>

            <p class="in-resumen-aviso" th:if="${sinResponder > 0}">
                <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
                Quedan <strong th:text="${sinResponder}">2</strong> preguntas sin responder: si entregás ahora se contarán como vacías.
            </p>
            <div class="in-resumen-acciones">
                <a class="pn-btn pn-btn-secundario" th:if="${volverA != null}"
                   th:href="${libre} ? @{/intento/realizar/{id}(id=${intento.idIntentoAutoevaluacion}, pregunta=${volverA.orden})} : @{/intento/realizar/{id}(id=${intento.idIntentoAutoevaluacion})}">Volver al intento</a>
                <button type="button" class="pn-btn pn-btn-primario" data-entregar>Entregar todo y terminar</button>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/intento.js}"></script>
</body>
</html>
