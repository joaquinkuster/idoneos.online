<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <th:block th:replace="~{fragments/head :: recursos}"></th:block>
</head>
<body class="in-body" id="intento"
      th:attr="data-intento=${intento.idIntentoAutoevaluacion}, data-segundos=${segundosRestantes}, data-libre=${libre},
               data-sin-responder=${sinResponder}, data-url-ficha='/autoevaluacion/ver/' + ${autoevaluacion.idAutoevaluacion}">

    <th:block th:replace="~{fragments/intentoCabecera :: cabecera(${curso}, ${autoevaluacion}, ${segundosRestantes})}"></th:block>

    <main class="in-resumen">
        <section class="in-tarjeta in-resumen-tarjeta">
            <div class="in-resumen-cuerpo">
            <div>
                <h1 class="in-resumen-titulo">Resumen del intento</h1>
                <p class="in-resumen-subtitulo">
                    Respondiste <strong th:text="${respondidas + ' de ' + total}">8 de 10</strong> preguntas.
                </p>
                <div class="in-resumen-barra"><div th:style="${'width:' + (total == 0 ? 0 : 100 * respondidas / total) + '%'}"></div></div>
                <p class="in-resumen-porcentaje" th:text="${(total == 0 ? 0 : 100 * respondidas / total) + ' % completo'}">60 % completo</p>
            </div>

            <dl class="in-resumen-lista">
                <div th:if="${sinResponder > 0}">
                    <dt>Sin responder</dt>
                    <dd>
                        <th:block th:each="p : ${preguntas}" th:if="${!p.estaRespondida()}">
                            <a class="in-resumen-num" th:if="${libre}"
                               th:href="@{/intento/realizar/{id}(id=${intento.idIntentoAutoevaluacion}, pregunta=${p.orden})}" th:text="${p.orden}">1</a>
                            <span class="in-resumen-num" th:unless="${libre}" th:text="${p.orden}">1</span>
                        </th:block>
                    </dd>
                </div>
                <div th:if="${intento.cantidadMarcadas > 0}">
                    <dt>Para revisar</dt>
                    <dd>
                        <th:block th:each="p : ${preguntas}" th:if="${p.marcada}">
                            <a class="in-resumen-num" th:href="@{/intento/realizar/{id}(id=${intento.idIntentoAutoevaluacion}, pregunta=${p.orden})}" th:text="${p.orden}">1</a>
                        </th:block>
                    </dd>
                </div>
                <div th:if="${sinResponder == 0 and intento.cantidadMarcadas == 0}">
                    <dt>Estado</dt>
                    <dd>Respondiste todas las preguntas.</dd>
                </div>
            </dl>
            </div>

            <div class="in-resumen-pie">
            <p class="in-resumen-aviso" th:if="${sinResponder > 0}">
                Si entregás ahora, las preguntas sin responder se cuentan como vacías.
            </p>
            <div class="in-resumen-acciones">
                <a class="pn-btn pn-btn-secundario" th:if="${volverA != null}"
                   th:href="${libre} ? @{/intento/realizar/{id}(id=${intento.idIntentoAutoevaluacion}, pregunta=${volverA.orden})} : @{/intento/realizar/{id}(id=${intento.idIntentoAutoevaluacion})}">Volver al intento</a>
                <button type="button" class="pn-btn pn-btn-primario" data-entregar>Entregar todo y terminar</button>
            </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/intento.js}"></script>
</body>
</html>
