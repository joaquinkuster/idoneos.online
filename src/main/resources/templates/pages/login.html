<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-dark text-white text-center py-4">
                        <i class="fa-solid fa-chart-line text-primary display-5 mb-2"></i>
                        <h3 class="fw-bold mb-0">Idóneos<span class="text-primary">Online</span></h3>
                        <small class="text-white-50">Plataforma de Cursos de Educación Financiera</small>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <div th:if="${mensaje != null}" class="alert alert-info alert-dismissible fade show" role="alert">
                            <span th:text="${mensaje}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <h4 class="fw-bold text-center mb-4">Iniciar Sesión</h4>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label font-weight-bold">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                                    <input type="email" class="form-control" id="username" name="username" placeholder="usuario@correo.com" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="password" class="form-label font-weight-bold mb-0">Contraseña</label>
                                    <a th:href="@{/recuperar-contrasena}" class="small text-decoration-none">¿Olvidaste tu contraseña?</a>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill font-weight-bold mb-3">Ingresar</button>
                        </form>

                        <div class="position-relative my-3 text-center">
                            <hr class="text-muted">
                            <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small">o ingresá con</span>
                        </div>

                        <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-danger w-100 py-2 rounded-pill fw-bold d-flex align-items-center justify-content-center gap-2">
                            <i class="fa-brands fa-google fs-5"></i>Ingresar con Google
                        </a>

                        <hr class="my-4">

                        <p class="text-center text-muted mb-0">
                            ¿No tienes cuenta aún? <a th:href="@{/registro}" class="text-primary fw-bold text-decoration-none">Registrate gratis aquí</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
