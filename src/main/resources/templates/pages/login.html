<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <th:block th:replace="~{fragments/layout/head :: recursos}"></th:block>
</head>
<body class="auth-body">

    <!-- Top Navbar Oficial Dinámica -->
    <div th:replace="~{fragments/layout/navbar :: navbar}"></div>

    <div class="auth-pagina">

        <div th:replace="~{fragments/layout/auth :: fondo}"></div>

        <div class="auth-contenedor">
            <div class="auth-card">

                <!-- Izquierda: formulario -->
                <div class="auth-izquierda">
                    <div th:replace="~{fragments/layout/auth :: cabecera('Plataforma de formación en Finanzas, Economía y Mercado de Capitales')}"></div>

                    <form th:action="@{/login}" method="post" class="auth-form">
                        <div th:if="${errorLogin}" class="auth-error" role="alert" th:text="${errorLogin}">Error</div>

                        <div class="auth-grupo">
                            <label for="correo">Correo</label>
                            <input id="correo" name="username" type="email" placeholder="tu.correo@ejemplo.com" required autocomplete="email" autofocus>
                        </div>

                        <div class="auth-grupo">
                            <label for="contrasena">Contraseña</label>
                            <div class="auth-clave">
                                <input id="contrasena" name="password" type="password" placeholder="••••••••" required autocomplete="current-password">
                                <button type="button" class="auth-clave-ver" data-ver-clave aria-label="Mostrar contraseña">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="auth-opciones">
                            <label class="auth-recordarme">
                                <input type="checkbox" name="recordarme" value="true">
                                <span>Recordarme</span>
                            </label>
                            <button type="button" class="auth-enlace" data-bs-toggle="modal" data-bs-target="#modalRecuperar">¿Olvidaste tu contraseña?</button>
                        </div>

                        <button type="submit" class="auth-boton">Iniciar sesión</button>
                    </form>

                    <div class="auth-separador"><span>o</span></div>
                    <a th:href="@{/oauth2/authorization/google}" class="auth-boton-google"><i class="fa-brands fa-google"></i> Continuar con Google</a>

                    <!-- Solo en pantallas chicas, donde se oculta el panel de la derecha -->
                    <div class="auth-registro-movil">
                        <p>¿Primera vez aquí?</p>
                        <button type="button" class="auth-boton-secundario" data-registro>Crear nueva cuenta</button>
                    </div>
                </div>

                <!-- Derecha: invitación a registrarse -->
                <div class="auth-derecha">
                    <div class="auth-promo">
                        <h2>¿Primera vez aquí?</h2>
                        <p>Registrate para inscribirte a los cursos y seguir tu avance</p>
                        <button type="button" class="auth-promo-boton" data-registro>Crear cuenta nueva</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Ventana: recuperar la contraseña. Pide el correo y envía el enlace para crear una contraseña nueva. -->
    <div class="modal fade pn-modal" id="modalRecuperar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="pn-modal-cabecera">
                    <h3 class="pn-modal-titulo">Recuperar contraseña</h3>
                    <button type="button" class="pn-modal-cerrar" data-bs-dismiss="modal" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="pn-modal-cuerpo">
                    <form th:action="@{/usuario/solicitarRecuperacion}" method="post" class="form-ajax" data-validar data-validador="auth" novalidate>
                        <div class="pn-campo">
                            <label class="pn-etiqueta">Correo de tu cuenta <span class="pn-obligatorio">*</span></label>
                            <input type="email" name="correo" class="pn-input" maxlength="150" placeholder="tu.correo@ejemplo.com" autocomplete="email" required>
                            <div class="pn-ayuda-error"></div>
                        </div>
                        <p class="auth-nota">Te enviaremos un enlace para crear una contraseña nueva. Vence en 1 hora.</p>
                        <div class="pn-modal-pie">
                            <button type="button" class="pn-btn pn-btn-secundario" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="pn-btn pn-btn-primario">Enviar enlace</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/layout/auth :: scripts}"></th:block>
</body>
</html>
