<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light d-flex flex-column min-vh-100">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-key fa-3x text-warning mb-2"></i>
                        <h3 class="fw-bold">Recuperar Contraseña</h3>
                        <p class="text-muted small">Ingresá tu correo electrónico registrado para enviarte un enlace de recuperación.</p>
                    </div>

                    <div th:if="${mensaje}" class="alert alert-info alert-dismissible fade show rounded-3 mb-4" role="alert">
                        <span th:text="${mensaje}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div th:if="${tokenDemo}" class="p-3 bg-warning bg-opacity-10 border border-warning rounded-3 mb-4 text-center">
                        <small class="fw-bold text-dark d-block mb-1"><i class="fa-solid fa-link me-1"></i>Enlace de prueba generado:</small>
                        <a th:href="@{'/resetear-contrasena?token=' + ${tokenDemo}}" class="btn btn-sm btn-dark rounded-pill">Restablecer mi contraseña ahora</a>
                    </div>

                    <form th:action="@{/recuperar-contrasena}" method="post">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                                <input type="email" name="correo" class="form-control border-start-0 ps-0" placeholder="tu@correo.com" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 fw-bold rounded-pill py-2 mb-3">
                            <i class="fa-solid fa-paper-plane me-2"></i>Enviar Enlace
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/login}" class="text-decoration-none small text-muted">
                            <i class="fa-solid fa-arrow-left me-1"></i>Volver a Iniciar Sesión
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
