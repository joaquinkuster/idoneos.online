<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <th:block th:replace="~{fragments/layout/head :: recursos}"></th:block>
</head>
<body class="pn-body">
<div class="pn-app" id="pnApp">
    <!-- Menú lateral: el del docente (gestión académica) o, para el administrador, el del panel -->
    <th:block th:replace="~{fragments/layout/sidebar :: gestionAcademica(${menuActivo}, ${urlBase})}"></th:block>

    <div class="pn-principal">
        <th:block th:if="${esDocente}"><th:block th:replace="~{fragments/layout/panel :: barra(null)}"></th:block></th:block>
        <th:block th:unless="${esDocente}"><th:block th:replace="~{fragments/layout/panel :: barra(null)}"></th:block></th:block>

        <main class="pn-contenido">
            <nav class="ac-migas" aria-label="Ruta de navegación">
                <a th:href="@{/inicio}">Página principal</a>
                <i class="fa-solid fa-chevron-right"></i>
                <a th:href="@{${urlMisCursos}}" th:text="${esAdministrador == true ? 'Cursos' : 'Mis cursos'}">Mis cursos</a>
                <i class="fa-solid fa-chevron-right"></i>
                <a th:href="@{${urlBase}}" th:text="${curso.nombre}">Curso</a>
                <i class="fa-solid fa-chevron-right"></i>
                <strong>Cronogramas</strong>
            </nav>

            <!-- La misma card de cabecera del inicio del curso, con el selector de programa (sin cohorte por defecto ni pestañas) -->
            <div class="ac-principal">
                <th:block th:replace="~{pages/curso/cabecera :: cabecera(false, true)}"></th:block>
            </div>

            <!-- Con inscripciones activas el cronograma es lo que el alumno vio y pagó: solo se puede consultar -->
            <div class="ac-aviso ac-aviso-atraso" th:if="${programa != null and soloLecturaPorInscripciones}">
                <div>
                    <strong>Cronograma en solo lectura</strong>
                    <span>El programa tiene <span th:text="${programa.cantidadInscripcionesActivas + (programa.cantidadInscripcionesActivas == 1 ? ' inscripción activa asociada' : ' inscripciones activas asociadas')}">2 inscripciones activas asociadas</span>: no se puede modificar su cronograma. Es lo que el alumno vio y pagó al inscribirse.</span>
                </div>
            </div>

            <th:block th:if="${programa != null}" th:with="cronoCohorte=${esDocente ? cohorte : null}">
                <th:block th:replace="~{pages/cronograma/board :: board(${curso}, ${programa}, ${cronograma}, ${temasDelCurso}, ${puedeEditar}, false)}"></th:block>
            </th:block>
            <th:block th:if="${programa == null}">
                <th:block th:replace="~{fragments/components/empty :: bloque('fa-calendar', 'No hay cronograma para mostrar', 'La cohorte de trabajo todavía no tiene programa. Elegí uno desde el inicio del curso para armar su cronograma.', null, null)}"></th:block>
            </th:block>
        </main>

        <th:block th:replace="~{fragments/layout/panel :: pie(${esDocente ? 'Gestión académica' : 'Panel del administrador'})}"></th:block>
    </div>
</div>

<th:block th:replace="~{fragments/layout/panel :: scripts}"></th:block>
<script th:src="@{/js/core/curso.js}"></script>
<script th:src="@{/js/pages/curso/contexto.js}"></script>
<script th:src="@{/js/pages/cronograma/tooltip.js}"></script>
<script th:src="@{/js/pages/cronograma/board.js}" th:if="${programa != null}"></script>
<script>
    // Cambiar el programa del selector recarga el cronograma de ese programa
    document.querySelectorAll('[data-cambia-envia]').forEach(function (s) {
        s.addEventListener('change', function () { if (s.value) { s.form.submit(); } });
    });
</script>
</body>
</html>
