<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .header { background: #081426; padding: 30px; text-align: center; color: #ffffff; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 700; }
        .header span { color: #f59e0b; }
        .content { padding: 30px; }
        .btn { display: inline-block; padding: 12px 28px; background: #081426; color: #ffffff !important; text-decoration: none; border-radius: 6px; font-weight: 600; margin-top: 20px; }
        .footer { background: #f1f5f9; padding: 20px; text-align: center; font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Idóneos <span>Online</span></h1>
        </div>
        <div class="content">
            <h2 th:text="${titulo != null ? titulo : 'Notificación Oficial'}">Notificación</h2>
            <p th:utext="${cuerpo}">Contenido de la notificación...</p>
            <div th:if="${urlBoton != null}" style="text-align: center;">
                <a th:href="${urlBoton}" class="btn" th:text="${textoBoton != null ? textoBoton : 'Ingresar a la Plataforma'}">Acceder</a>
            </div>
            <p th:if="${pie != null}" style="margin-top: 30px; font-size: 13px; color: #64748b;" th:text="${pie}"></p>
        </div>
        <div class="footer">
            <p>© 2026 Idóneos Online S.A.S. • Educación Financiera y Mercado de Capitales</p>
        </div>
    </div>
</body>
</html>
