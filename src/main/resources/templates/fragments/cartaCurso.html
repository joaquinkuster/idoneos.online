<!-- Fragmento Carta Curso -->
<div th:fragment="cartaCurso" class="idn-card h-100 p-4 d-flex flex-column justify-content-between">
    <div>
        <div class="d-flex justify-content-between align-items-start gap-2 mb-3">
            <span class="badge bg-gold-soft rounded-pill px-3 py-2" th:text="${curso.categoria.nombre}">Finanzas</span>
            <span class="badge bg-light text-dark border rounded-pill px-3 py-2" th:if="${curso.esGratuito()}">GRATIS</span>
        </div>

        <h3 class="font-serif fs-4 fw-bold text-navy mb-2" style="line-height: 1.25;" th:text="${curso.nombre}">Nombre del Curso</h3>
        <p class="small text-muted mb-3" style="line-height: 1.65;" th:text="${#strings.abbreviate(curso.descripcion, 120)}">Descripción breve...</p>
    </div>

    <div>
        <!-- Docente titular -->
        <div class="d-flex align-items-center gap-2 mb-3 pt-2">
            <div class="rounded-circle bg-gold-soft text-gold-deep fw-bold d-flex align-items-center justify-content-center" style="width: 24px; height: 24px; font-size: 10px;"
                 th:text="${curso.getDocenteTitular() != null ? #strings.substring(curso.getDocenteTitular().getNombreCompleto(), 0, 2) : 'DO'}">DO</div>
            <small class="fw-semibold text-dark" th:text="${curso.getDocenteTitular() != null ? curso.getDocenteTitular().getNombreCompleto() : 'Docente Idóneos'}">Docente</small>
        </div>

        <!-- Meta info & Precio -->
        <div class="d-flex align-items-center justify-content-between pt-3 border-top">
            <div class="d-flex gap-3 small text-muted">
                <span><i class="fa-solid fa-book-open me-1"></i> <span th:text="${curso.unidades.size()}">10</span> unid.</span>
            </div>

            <div class="d-flex align-items-center gap-2">
                <span th:if="${curso.esGratuito()}" class="font-serif fw-bold text-success fs-5">¡Gratis!</span>
                <span th:unless="${curso.esGratuito()}" class="font-serif fw-bold text-navy fs-5" th:text="'$' + ${#numbers.formatDecimal(curso.precio, 1, 'POINT', 0, 'COMMA')}">$0</span>
                <a th:href="@{'/cursos/' + ${curso.id}}" class="btn btn-sm px-3 rounded-pill idn-btn-gold">
                    Ver
                </a>
            </div>
        </div>
    </div>
</div>
