<!-- Fragmento Carta Curso -->
<div th:fragment="cartaCurso" class="card card-curso h-100 shadow-sm overflow-hidden">
    <div class="bg-dark text-white p-4 text-center position-relative d-flex flex-column justify-content-center" style="min-height: 160px; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);">
        <span class="badge bg-primary position-absolute top-0 end-0 m-3 rounded-pill px-3 py-2" th:text="${curso.categoria.nombre}">Finanzas</span>
        <h5 class="fw-bold mb-1" th:text="${curso.nombre}">Nombre del Curso</h5>
        <small class="text-white-50" th:text="'Titular: ' + ${curso.docenteTitular.nombreCompleto}">Docente</small>
    </div>
    <div class="card-body d-flex flex-column">
        <p class="card-text text-muted flex-grow-1" th:text="${#strings.abbreviate(curso.descripcion, 120)}">Descripción breve del curso...</p>
        <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
            <div>
                <span th:if="${curso.esGratuito()}" class="fw-bold text-success fs-5">GRATUITO</span>
                <span th:if="${!curso.esGratuito()}" class="fw-bold text-dark fs-5" th:text="'$' + ${#numbers.formatDecimal(curso.precio, 1, 'POINT', 0, 'COMMA')}">$0</span>
            </div>
            <a th:href="@{'/cursos/' + ${curso.id}}" class="btn btn-outline-primary btn-sm rounded-pill px-3">Ver Detalle</a>
        </div>
    </div>
</div>
