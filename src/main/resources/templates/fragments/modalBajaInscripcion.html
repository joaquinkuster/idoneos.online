<!-- Ventana de baja de una inscripción (CU-49), la misma para el alumno y el administrador: confirmación, motivo
     opcional.
     id: id de la ventana; pregunta: texto de la confirmación; idInscripcion: inscripción que se da de baja. -->
<div th:fragment="bloque(id, pregunta, idInscripcion)" class="modal fade pn-modal pn-modal-alerta" th:id="${id}" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="pn-modal-cabecera">
                <h3 class="pn-modal-titulo">Dar de baja inscripción</h3>
                <button type="button" class="pn-modal-cerrar" data-bs-dismiss="modal" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="pn-modal-cuerpo">
                <div class="text-center">
                    <div class="pn-baja-icono"><i class="fa-solid fa-triangle-exclamation"></i></div>
                    <h4 class="pn-modal-titulo mb-2" th:text="${pregunta}">¿Confirmas dar de baja la inscripción?</h4>
                </div>
                <form th:action="@{'/inscripcion/darDeBaja/' + ${idInscripcion}}" method="post" class="form-ajax" data-validar novalidate>
                    <div class="pn-campo mb-3">
                        <div class="pn-etiqueta-fila">
                            <label class="pn-etiqueta">Motivo (opcional)</label>
                            <span class="pn-contador">0 / 300</span>
                        </div>
                        <textarea name="motivo" class="pn-input" rows="3" maxlength="300" placeholder="Motivo de la baja" data-contador></textarea>
                        <div class="pn-ayuda-error"></div>
                    </div>
                    <div class="pn-modal-pie">
                        <button type="button" class="pn-btn pn-btn-secundario" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="pn-btn pn-btn-peligro">Dar de baja</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
