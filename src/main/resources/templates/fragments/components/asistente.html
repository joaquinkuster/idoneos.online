<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<body>
    <!-- Asistente navegacional: botón flotante (una brújula) en la esquina inferior derecha con la cantidad de pendientes del usuario y, al abrirlo,
         una carta con la «ruta» de lo que tiene pendiente según su rol (autoevaluaciones del alumno, cohortes pendientes de contenido del
         docente, pagos pendientes del administrador): el primero marcado como «Ahora» y los demás como los pasos que siguen. Cada paso es un
         enlace a la pantalla donde se resuelve. Las acciones rápidas quedan fijas al pie, y los pasos hacen scroll por encima. No usa
         inteligencia artificial: lo arma el sistema (GET /asistente/pendientes). static/js/layout/asistente.js lo mueve al final del body y
         dibuja el contenido. -->
    <div th:fragment="bloque" th:if="${usuario != null and (usuario.esAlumnoActivo() or usuario.esDocenteActivo() or usuario.esAdministradorActivo())}"
         class="as-asistente" id="asistente" data-asistente>
        <section class="as-panel" id="asistentePanel" role="dialog" aria-label="Asistente" hidden>
            <header class="as-cabecera" data-asistente-cabecera>
                <div class="as-cab-textos">
                    <span class="as-eti">Tu ruta</span>
                    <div class="as-cab-titulo" data-asistente-titulo>Asistente</div>
                </div>
                <button type="button" class="as-cerrar" data-asistente-cerrar aria-label="Cerrar el asistente"><i class="fa-solid fa-xmark"></i></button>
            </header>
            <div class="as-cuerpo" data-asistente-cuerpo></div>
            <footer class="as-pie" data-asistente-pie hidden></footer>
        </section>
        <button type="button" class="as-boton" data-asistente-abrir aria-label="Abrir el asistente" aria-expanded="false" aria-controls="asistentePanel">
            <i class="fa-regular fa-compass" aria-hidden="true"></i>
            <span class="as-contador" data-asistente-contador hidden>0</span>
        </button>
    </div>
</body>

</html>
