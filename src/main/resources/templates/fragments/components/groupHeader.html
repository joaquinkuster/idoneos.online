<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<body>
    <!-- Cabecera de un grupo de categoría en un listado agrupado (tabla o cards). -->
    <tr th:fragment="fila(categoria, total, bajas)" class="pn-grupo pn-grupo-fila" data-grupo role="button" tabindex="0" aria-expanded="true">
        <td colspan="99">
            <i class="fa-solid fa-chevron-down pn-grupo-flecha" aria-hidden="true"></i>
            <span class="pn-grupo-nombre" th:text="${categoria.nombre}">Categoría</span>
            <span class="pn-grupo-conteo" th:text="${total + (total == 1 ? ' curso' : ' cursos') + (bajas > 0 ? ' · ' + bajas + (bajas == 1 ? ' dado de baja' : ' dados de baja') : '')}">6 cursos</span>
        </td>
    </tr>

    <!-- Divisor de una tabla agrupada por un texto cualquiera (por ejemplo, el tipo de recurso). -->
    <tr th:fragment="filaTipo(nombre, total)" class="pn-grupo pn-grupo-fila" data-grupo role="button" tabindex="0" aria-expanded="true">
        <td colspan="99">
            <i class="fa-solid fa-chevron-down pn-grupo-flecha" aria-hidden="true"></i>
            <span class="pn-grupo-nombre" th:text="${nombre}">Grabación</span>
            <span class="pn-grupo-conteo" th:text="${total + (total == 1 ? ' recurso' : ' recursos')}">6 recursos</span>
        </td>
    </tr>

    <!-- Encabezado de la carta de una categoría (cards): la etiqueta dorada. -->
    <div th:fragment="carta(categoria, total)" class="pn-grupo pn-grupo-cabecera" data-grupo role="button" tabindex="0" aria-expanded="true">
        <div>
            <span class="pn-grupo-etiqueta">Categoría</span>
            <div class="pn-grupo-nombre-fila">
                <h2 class="pn-grupo-titulo" th:text="${categoria.nombre}">Categoría</h2>
                <span class="pn-grupo-conteo" th:text="${total + (total == 1 ? ' curso' : ' cursos')}">6 cursos</span>
            </div>
        </div>
        <span class="pn-grupo-accion">
            <span class="pn-grupo-ocultar">Ocultar cursos</span><span class="pn-grupo-mostrar">Mostrar cursos</span>
            <i class="fa-solid fa-chevron-up pn-grupo-flecha" aria-hidden="true"></i>
        </span>
    </div>

    <!-- Encabezado de la carta de cursos con cohortes pendientes de contenido: igual al de una categoría. -->
    <div th:fragment="pendientes(total)" class="pn-grupo pn-grupo-cabecera" data-grupo role="button" tabindex="0" aria-expanded="true">
        <i class="fa-solid fa-circle-exclamation pn-grupo-aviso" aria-hidden="true"></i>
        <div class="pn-grupo-textos">
            <span class="pn-grupo-etiqueta">Requiere tu acción</span>
            <div class="pn-grupo-nombre-fila">
                <h2 class="pn-grupo-titulo">Pendientes de contenido</h2>
                <span class="pn-grupo-conteo" th:text="${total + (total == 1 ? ' curso' : ' cursos')}">2 cursos</span>
            </div>
        </div>
        <span class="pn-grupo-accion">
            <span class="pn-grupo-ocultar">Ocultar cursos</span><span class="pn-grupo-mostrar">Mostrar cursos</span>
            <i class="fa-solid fa-chevron-up pn-grupo-flecha" aria-hidden="true"></i>
        </span>
    </div>

    <!-- Encabezado de la carta de cursos recomendados (catálogo del alumno con intereses). -->
    <div th:fragment="recomendados(total)" class="pn-grupo pn-grupo-cabecera" data-grupo role="button" tabindex="0" aria-expanded="true">
        <i class="fa-solid fa-wand-magic-sparkles pn-grupo-aviso" aria-hidden="true"></i>
        <div class="pn-grupo-textos">
            <span class="pn-grupo-etiqueta">Según tus intereses</span>
            <div class="pn-grupo-nombre-fila">
                <h2 class="pn-grupo-titulo">Cursos que podrían interesarte</h2>
                <span class="pn-grupo-conteo" th:text="${total + (total == 1 ? ' curso' : ' cursos')}">6 cursos</span>
            </div>
        </div>
        <span class="pn-grupo-accion">
            <span class="pn-grupo-ocultar">Ocultar cursos</span><span class="pn-grupo-mostrar">Mostrar cursos</span>
            <i class="fa-solid fa-chevron-up pn-grupo-flecha" aria-hidden="true"></i>
        </span>
    </div>
</body>

</html>
