<!-- Avatar de un usuario: su foto de perfil (como en Moodle) o, si no tiene. -->
<span th:fragment="avatar(usuario, clase)" class="av" th:classappend="${clase}" aria-hidden="true">
    <img th:if="${usuario != null and usuario.urlImagen != null}" th:src="@{${usuario.urlImagen}}" alt="">
    <th:block th:unless="${usuario != null and usuario.urlImagen != null}" th:text="${usuario != null ? usuario.iniciales : '?'}">VR</th:block>
</span>
