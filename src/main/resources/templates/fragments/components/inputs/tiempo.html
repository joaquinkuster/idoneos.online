<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<body>
    <!-- Campo de tiempo escrito en partes (static/js/components/tiempo.js): horas y minutos, o meses. -->
    <div th:fragment="minutos(nombre, valor, bloqueado, mensaje, condicional)" class="pn-tiempo" data-tiempo="minutos">
        <input type="text" class="pn-tiempo-total" th:name="${nombre}" th:value="${valor}" th:required="${mensaje != null}" tabindex="-1" aria-hidden="true"
               data-tiempo-total th:attr="data-mensaje-obligatorio=${mensaje}, data-requerido=${condicional ? '' : null}">
        <input type="hidden" th:name="${nombre + 'Unidad'}" value="minutos">
        <div class="pn-tiempo-fila">
            <label class="pn-tiempo-parte"><span>Horas</span>
                <input type="number" min="0" step="1" class="pn-input" data-tiempo-parte placeholder="0"
                       th:value="${valor != null ? valor / 60 : ''}" th:readonly="${bloqueado}" th:classappend="${bloqueado} ? 'pn-bloqueado'">
            </label>
            <label class="pn-tiempo-parte"><span>Minutos</span>
                <input type="number" min="0" step="1" class="pn-input" data-tiempo-parte placeholder="0"
                       th:value="${valor != null ? valor % 60 : ''}" th:readonly="${bloqueado}" th:classappend="${bloqueado} ? 'pn-bloqueado'">
            </label>
        </div>
        <p class="pn-tiempo-eq" data-tiempo-eq></p>
    </div>

    <div th:fragment="dias(nombre, valor, bloqueado, mensaje, condicional)" class="pn-tiempo" data-tiempo="dias">
        <input type="text" class="pn-tiempo-total" th:name="${nombre}" th:value="${valor}" th:required="${mensaje != null}" tabindex="-1" aria-hidden="true"
               data-tiempo-total th:attr="data-mensaje-obligatorio=${mensaje}, data-requerido=${condicional ? '' : null}">
        <input type="hidden" th:name="${nombre + 'Unidad'}" value="dias">
        <div class="pn-tiempo-fila">
            <label class="pn-tiempo-parte"><span>Meses</span>
                <input type="number" min="0" step="1" class="pn-input" data-tiempo-parte placeholder="0"
                       th:value="${valor != null ? valor / 30 : ''}" th:readonly="${bloqueado}" th:classappend="${bloqueado} ? 'pn-bloqueado'">
            </label>
            <label class="pn-tiempo-parte"><span>Semanas</span>
                <input type="number" min="0" step="1" class="pn-input" data-tiempo-parte placeholder="0"
                       th:value="${valor != null ? (valor % 30) / 7 : ''}" th:readonly="${bloqueado}" th:classappend="${bloqueado} ? 'pn-bloqueado'">
            </label>
            <label class="pn-tiempo-parte"><span>Días</span>
                <input type="number" min="0" step="1" class="pn-input" data-tiempo-parte placeholder="0"
                       th:value="${valor != null ? (valor % 30) % 7 : ''}" th:readonly="${bloqueado}" th:classappend="${bloqueado} ? 'pn-bloqueado'">
            </label>
        </div>
        <p class="pn-tiempo-eq" data-tiempo-eq></p>
    </div>
</body>

</html>
