<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
<!-- Ventana de modificación. No va dentro del listado: el servidor la devuelve cuando se la pide (GET /inscripcion/modalEditar/{id}). -->
    <div th:fragment="modal(i)" class="modal fade pn-modal" th:id="'modalEditarInscripcion' + ${i.idInscripcion}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="pn-modal-cabecera">
                    <h3 class="pn-modal-titulo">Editar inscripción</h3>
                    <button type="button" class="pn-modal-cerrar" data-bs-dismiss="modal" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="pn-modal-cuerpo">
                    <form th:action="@{'/inscripcion/modificar/' + ${i.idInscripcion}}" method="post" class="form-ajax" data-validar data-pasos data-resumen="Inscripción" data-modo="modificacion"
                          data-contexto='[{"etiqueta":"Curso","atributoForm":"data-ctx-curso"},{"etiqueta":"Programa","atributoForm":"data-ctx-programa"},{"etiqueta":"Cohorte","atributoForm":"data-ctx-cohorte"}]' 
                          th:attr="data-resumen-titulo=${'(' + i.alumno.usuario.nombreCompleto + ')'}, data-ctx-curso=${i.cohorte.programa.curso.nombre}, data-ctx-programa=${i.cohorte.programa.nombre}, data-ctx-cohorte=${i.cohorte.etiqueta}" novalidate>
    <div class="pn-pasos pn-pasos-nombrados">
        <span class="pn-pasos-item"><span class="pn-pasos-punto">1</span><span class="pn-pasos-nombre">Datos de la inscripción</span></span><span class="pn-pasos-linea"></span>
        <span class="pn-pasos-item"><span class="pn-pasos-punto">2</span><span class="pn-pasos-nombre">Resumen</span></span>
    </div>
    <div class="pn-paso" data-grupo="Datos de la inscripción">
        <div class="pn-seccion-titulo">
            <h4>Datos de la inscripción</h4>
            <p>Vencimiento del acceso, habilitación y observaciones</p>
        </div>
        <div class="row g-3">
<div class="col-md-6 pn-campo">
                                <div class="pn-etiqueta-con-ayuda">
                                    <label class="pn-etiqueta">Vencimiento del acceso <span class="pn-obligatorio">*</span></label>
                                    <button type="button" class="cn-ayuda" aria-expanded="false" aria-label="Sobre el vencimiento del acceso" title="Ayuda"
                                            th:data-ayuda-destino="'ayudaVencimiento' + ${i.idInscripcion}"><i class="fa-solid fa-circle-info"></i></button>
                                </div>
                                <input type="date" name="vencimiento" class="pn-input" th:required="${i.fechaVencimientoAcceso != null}"
                                       th:value="${#temporals.format(i.fechaVencimientoAcceso, 'yyyy-MM-dd')}"
                                       th:min="${#temporals.format(i.vencimientoMinimo, 'yyyy-MM-dd')}">
                                <div class="pn-ayuda-error"></div>
                            </div>
<div class="col-md-6 pn-campo">
                                <label class="pn-etiqueta">Acceso habilitado</label>
                                <select name="habilitada" class="pn-input">
                                    <option value="true" th:selected="${i.estaHabilitada()}">Sí</option>
                                    <option value="false" th:selected="${!i.estaHabilitada()}">No (pendiente de pago)</option>
                                </select>
                                <div class="pn-ayuda-error"></div>
                            </div>
<div class="col-12 ayuda-desplegable" th:id="'ayudaVencimiento' + ${i.idInscripcion}">
                                <div class="ayuda-desplegable-interior">
                                    <div class="cn-info">
                                        <span th:text="${'Corrección administrativa (por ejemplo, una extensión de cortesía). El vencimiento no puede ser anterior al ' + #temporals.format(i.vencimientoMinimo, 'dd/MM/yyyy') + ', que resulta de la duración del cronograma.'}">Corrección administrativa.</span>
                                    </div>
                                </div>
                            </div>
<div class="col-12 pn-campo">
                                <div class="pn-etiqueta-fila">
                                    <label class="pn-etiqueta">Observaciones (opcional)</label>
                                    <span class="pn-contador" th:text="${#strings.length(i.observaciones != null ? i.observaciones : '') + ' / 500'}">0 / 500</span>
                                </div>
                                <textarea name="observaciones" class="pn-input" rows="3" maxlength="500" data-contador th:text="${i.observaciones}"></textarea>
                                <div class="pn-ayuda-error"></div>
                            </div>
        </div>
    </div>
    <div class="pn-paso">
        <div class="pn-seccion-titulo">
            <h4>Resumen</h4>
            <p>Estos son los cambios que se van a guardar</p>
        </div>
        <div class="pn-arbol" data-resumen-arbol></div>
    </div>
    <div class="pn-modal-pie">
        <button type="button" class="pn-btn pn-btn-contorno pn-pie-izquierda" data-paso-anterior>Anterior</button>
        <button type="button" class="pn-btn pn-btn-secundario" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="pn-btn pn-btn-primario" data-paso-siguiente>Siguiente</button>
        <button type="submit" class="pn-btn pn-btn-primario d-none" data-paso-guardar>Confirmar cambios</button>
    </div>
</form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
