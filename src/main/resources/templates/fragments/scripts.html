<th:block th:fragment="scripts">
    <!-- Bootstrap 5 Bundle JS (Includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SweetAlert2 JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Paginación Global -->
    <script>
        window.renderWfPagination = function(cfg) {
            const table = document.getElementById(cfg.tableId);
            const wrap = document.getElementById(cfg.wrapId);
            const info = document.getElementById(cfg.infoId);
            const ctrl = document.getElementById(cfg.controlsId);

            if (!table || !wrap || !info || !ctrl) return;

            const tbody = table.querySelector('tbody');
            if (!tbody) return;

            const allRows = Array.from(tbody.querySelectorAll('tr:not(.no-data)'));
            const totalRows = allRows.length;
            const rowsPerPage = cfg.rowsPerPage || 8;
            const totalPages = Math.max(1, Math.ceil(totalRows / rowsPerPage));
            const page = Math.min(Math.max(1, cfg.currentPage || 1), totalPages);

            const startIdx = (page - 1) * rowsPerPage;
            const endIdx = Math.min(startIdx + rowsPerPage, totalRows);

            allRows.forEach((row, idx) => {
                row.style.display = (idx >= startIdx && idx < endIdx) ? '' : 'none';
            });

            const entityLabel = cfg.entityLabel || 'registros';
            if (totalRows === 0) {
                info.textContent = 'Sin ' + entityLabel + ' para mostrar';
            } else {
                info.innerHTML = 'Mostrando <strong>' + (startIdx + 1) + '–' + endIdx + '</strong> de <strong>' + totalRows + '</strong> ' + entityLabel;
            }

            ctrl.innerHTML = '';
            if (totalPages <= 1) return;

            function makeBtn(html, extraClass, disabled, onClick) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'wf-page-btn' + (extraClass ? ' ' + extraClass : '');
                btn.innerHTML = html;
                btn.disabled = disabled;
                if (!disabled && onClick) btn.addEventListener('click', onClick);
                return btn;
            }

            ctrl.appendChild(makeBtn('<i class="fa-solid fa-chevron-left"></i> Anterior', 'wf-page-nav', page <= 1, () => cfg.onPageChange(page - 1)));

            const delta = 1;
            let pages = new Set([1, totalPages]);
            for (let i = Math.max(2, page - delta); i <= Math.min(totalPages - 1, page + delta); i++) pages.add(i);
            let sorted = Array.from(pages).sort((a, b) => a - b);
            let prev = 0;
            sorted.forEach(p => {
                if (p - prev > 1) {
                    const ellipsis = document.createElement('span');
                    ellipsis.className = 'wf-page-ellipsis';
                    ellipsis.textContent = '…';
                    ctrl.appendChild(ellipsis);
                }
                const isActive = p === page;
                ctrl.appendChild(makeBtn(p, isActive ? 'active' : '', isActive, () => cfg.onPageChange(p)));
                prev = p;
            });

            ctrl.appendChild(makeBtn('Siguiente <i class="fa-solid fa-chevron-right"></i>', 'wf-page-nav', page >= totalPages, () => cfg.onPageChange(page + 1)));
        };
    </script>
</th:block>

<th:block th:fragment="wf-global-scripts" th:replace="~{:: scripts}"></th:block>
