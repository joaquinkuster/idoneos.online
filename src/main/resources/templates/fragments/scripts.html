<div th:fragment="scripts">
    <!-- Bootstrap 5 Bundle JS (Includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SweetAlert2 JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Toast lateral delegador si wf_navbar no está presente -->
    <script th:if="${mensaje != null and !#strings.isEmpty(mensaje)}" th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var msg = /*[[${mensaje}]]*/ '';
            var title = '¡Operación Exitosa!';
            if (msg.toLowerCase().includes('sesión') || msg.toLowerCase().includes('sesion')) {
                if (msg.toLowerCase().includes('cerrado') || msg.toLowerCase().includes('cerrar')) {
                    title = 'Sesión Finalizada';
                } else if (msg.toLowerCase().includes('bienvenido') || msg.toLowerCase().includes('iniciado') || msg.toLowerCase().includes('ingreso')) {
                    title = '¡Bienvenido de vuelta!';
                }
            } else if (msg.toLowerCase().includes('registrad') || msg.toLowerCase().includes('cread') || msg.toLowerCase().includes('guardad')) {
                title = 'Guardado Exitoso';
            } else if (msg.toLowerCase().includes('actualizad') || msg.toLowerCase().includes('modificad') || msg.toLowerCase().includes('editad')) {
                title = 'Actualización Exitosa';
            } else if (msg.toLowerCase().includes('eliminad') || msg.toLowerCase().includes('baja') || msg.toLowerCase().includes('anulad')) {
                title = 'Eliminación Exitosa';
            }
            if (window.showIdoneosToast) {
                window.showIdoneosToast('success', title, msg);
            }
        });
    </script>

    <script th:if="${error != null and !#strings.isEmpty(error)}" th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var err = /*[[${error}]]*/ '';
            if (window.showIdoneosToast) {
                window.showIdoneosToast('error', 'Atención', err);
            }
        });
    </script>
</div>
