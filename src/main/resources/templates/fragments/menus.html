<!-- Menús laterales de cada módulo. Todos usan el marco reutilizable de fragments/sidebar.html:
     para sumar un módulo basta con agregar acá su fragmento de enlaces y su menú. -->

<!-- ========== Panel del administrador (MOD-F-01) ========== -->
<th:block th:fragment="administrador(activo)">
    <th:block th:replace="~{fragments/sidebar :: marco(~{fragments/menus :: enlacesAdministrador(${activo})})}"></th:block>
</th:block>

<th:block th:fragment="enlacesAdministrador(activo)">
    <div th:replace="~{fragments/sidebar :: grupo('Cursos')}"></div>
    <a th:replace="~{fragments/sidebar :: enlace('/curso/buscar', 'fa-book-open', 'Cursos', ${activo}, 'cursos')}"></a>
    <a th:replace="~{fragments/sidebar :: enlace('/categoria/buscar', 'fa-tags', 'Categorías', ${activo}, 'categorias')}"></a>
    <a th:replace="~{fragments/sidebar :: enlace('/cohorte/buscar', 'fa-calendar-days', 'Cohortes', ${activo}, 'cohortes')}"></a>

    <div th:replace="~{fragments/sidebar :: grupo('Inscripciones')}"></div>
    <a th:replace="~{fragments/sidebar :: enlace('/descuento/buscar', 'fa-percent', 'Descuentos', ${activo}, 'descuentos')}"></a>
    <a th:replace="~{fragments/sidebar :: enlace('/inscripcion/buscar', 'fa-user-graduate', 'Inscripciones', ${activo}, 'inscripciones')}"></a>
    <a th:replace="~{fragments/sidebar :: enlace('/pago/buscar', 'fa-credit-card', 'Pagos', ${activo}, 'pagos')}"></a>
</th:block>

<!-- ========== Gestión académica (MOD-F-02), para el alumno y el docente ==========
     urlBase: ruta del curso abierto ('/inscripcion/acceder/{id}' o '/curso/acceder/{id}'). La navegación se organiza según la jerarquía
     Curso → Programa → Cohorte → Tema; los enlaces con '#' no tienen acción por ahora. -->
<th:block th:fragment="gestionAcademica(activo, urlBase)">
    <th:block th:replace="~{fragments/sidebar :: marco(~{fragments/menus :: enlacesGestionAcademica(${activo}, ${urlBase})})}"></th:block>
</th:block>

<th:block th:fragment="enlacesGestionAcademica(activo, urlBase)">
    <a th:replace="~{fragments/sidebar :: enlace(${urlBase}, 'fa-house', ${curso != null ? #strings.abbreviate(curso.nombre, 22) : 'Curso'}, ${activo}, 'curso')}"></a>

    <!-- Lo que el alumno no puede abrir no se le muestra (y sin botones, tampoco el título del grupo). El diseño del curso
         (datos, temas y programas) lleva un indicador: verde si está completo, naranja si falta algo -->
    <th:block th:if="${esDocente == true or esAdministrador == true}">
        <div th:replace="~{fragments/sidebar :: grupo('Diseño de curso')}"></div>
        <a th:replace="~{fragments/sidebar :: enlaceEstado('/diseno/buscar?cursoId=' + ${curso.idCurso}, 'fa-compass-drafting', 'Diseño de curso', ${activo}, 'diseno', ${estadoDiseno == null ? null : (estadoDiseno.datosCompletos ? 'ok' : 'pendiente')})}"></a>
        <a th:replace="~{fragments/sidebar :: enlaceEstado('/tema/buscar?cursoId=' + ${curso.idCurso}, 'fa-layer-group', 'Temas', ${activo}, 'temas', ${estadoDiseno == null ? null : (estadoDiseno.temasCompletos ? 'ok' : 'pendiente')})}"></a>
        <a th:replace="~{fragments/sidebar :: enlaceEstado('/programa/buscar?cursoId=' + ${curso.idCurso}, 'fa-book-bookmark', 'Programas', ${activo}, 'programas', ${estadoDiseno == null ? null : (estadoDiseno.programaCompleto ? 'ok' : 'pendiente')})}"></a>

        <div th:replace="~{fragments/sidebar :: grupo('Dictado')}"></div>
        <a th:replace="~{fragments/sidebar :: enlace((${esAdministrador == true} ? '/cohorte/buscar?cursoId=' + ${curso.idCurso} : '/cohorte/buscar'), 'fa-calendar-days', 'Cohortes', ${activo}, 'cohortes')}"></a>
    </th:block>
    <!-- El alumno ve el cronograma del programa en el que está inscripto -->
    <th:block th:unless="${esDocente == true or esAdministrador == true}">
        <div th:replace="~{fragments/sidebar :: grupo('Este programa')}"></div>
        <a th:replace="~{fragments/sidebar :: enlace(${urlBase} + '?seccion=cronograma', 'fa-calendar-check', 'Cronograma', ${activo}, 'cronograma')}"></a>
    </th:block>

    <div th:replace="~{fragments/sidebar :: grupo('Esta cohorte')}"></div>
    <!-- Las clases en vivo solo existen en los cursos con esa modalidad -->
    <th:block th:if="${curso == null or curso.incluyeModalidad('En vivo')}">
        <a th:replace="~{fragments/sidebar :: enlace(${urlBase} + '?seccion=clases', 'fa-video', 'Clases en vivo', ${activo}, 'clases')}"></a>
    </th:block>
    <a th:replace="~{fragments/sidebar :: enlace((${esDocente == true or esAdministrador == true} ? '/participante/buscar?cursoId=' + ${curso.idCurso} : ${#strings.replace(urlBase, '/inscripcion/acceder/', '/participante/ver/')}), 'fa-users', 'Participantes', ${activo}, 'docentes')}"></a>
    <th:block th:if="${esDocente == true or esAdministrador == true}">
        <a th:replace="~{fragments/sidebar :: enlace('/progreso/buscar?cursoId=' + ${curso.idCurso}, 'fa-chart-line', 'Progreso', ${activo}, 'progreso')}"></a>
    </th:block>
    <th:block th:if="${esDocente == true or esAdministrador == true}">
        <a th:replace="~{fragments/sidebar :: enlace('/intento/buscar?cursoId=' + ${curso.idCurso}, 'fa-clipboard-list', 'Intentos', ${activo}, 'intentos')}"></a>
    </th:block>
    <a th:replace="~{fragments/sidebar :: enlace((${esDocente == true or esAdministrador == true} ? '/calificacion/buscar?cursoId=' + ${curso.idCurso} : ${#strings.replace(urlBase, '/inscripcion/acceder/', '/calificacion/ver/')}), 'fa-star', 'Calificaciones', ${activo}, 'calificaciones')}"></a>

    <div th:replace="~{fragments/sidebar :: grupo('Contenido de los temas')}"></div>
    <th:block th:if="${esDocente == true or esAdministrador == true}">
        <a th:replace="~{fragments/sidebar :: enlace('/material/buscar?cursoId=' + ${curso.idCurso}, 'fa-file-lines', 'Materiales', ${activo}, 'materiales')}"></a>
        <a th:replace="~{fragments/sidebar :: enlace('/glosario/buscar?cursoId=' + ${curso.idCurso}, 'fa-spell-check', 'Glosario', ${activo}, 'glosario')}"></a>
    </th:block>
    <th:block th:if="${esDocente == true or esAdministrador == true}">
        <a th:replace="~{fragments/sidebar :: enlace('/pool/buscar?cursoId=' + ${curso.idCurso}, 'fa-circle-question', 'Pools', ${activo}, 'pools')}"></a>
    </th:block>
    <th:block th:if="${esDocente == true or esAdministrador == true}">
        <a th:replace="~{fragments/sidebar :: enlace('/autoevaluacion/buscar?cursoId=' + ${curso.idCurso}, 'fa-clipboard-check', 'Autoevaluaciones', ${activo}, 'autoevaluaciones')}"></a>
    </th:block>
    <th:block th:unless="${esDocente == true or esAdministrador == true}">
        <a th:replace="~{fragments/sidebar :: enlace('#', 'fa-clipboard-check', 'Autoevaluaciones', ${activo}, 'autoevaluaciones')}"></a>
    </th:block>
    <th:block th:if="${esDocente == true or esAdministrador == true}">
        <a th:replace="~{fragments/sidebar :: enlace('/foro/buscar?cursoId=' + ${curso.idCurso}, 'fa-comments', 'Foros', ${activo}, 'foros')}"></a>
    </th:block>
</th:block>
