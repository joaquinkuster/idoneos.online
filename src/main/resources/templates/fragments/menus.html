<!-- Menús laterales de cada módulo. Todos usan el marco reutilizable de fragments/sidebar.html:
     para sumar un módulo basta con agregar acá su fragmento de enlaces y su menú. -->

<!-- ========== Panel del administrador (MOD-F-01) ========== -->
<th:block th:fragment="administrador(activo)">
    <th:block th:replace="~{fragments/sidebar :: marco(~{fragments/menus :: enlacesAdministrador(${activo})})}"></th:block>
</th:block>

<th:block th:fragment="enlacesAdministrador(activo)">
    <div th:replace="~{fragments/sidebar :: grupo('Cursos')}"></div>
    <a th:replace="~{fragments/sidebar :: enlace('/curso/buscar', 'fa-book-open', 'Cursos', ${activo}, 'cursos')}"></a>
    <a th:replace="~{fragments/sidebar :: enlace('/categoria/buscar', 'fa-tags', 'Categorías', ${activo}, 'categorias')}"></a>
    <a th:replace="~{fragments/sidebar :: enlace('/cohorte/buscar', 'fa-calendar-days', 'Cohortes', ${activo}, 'cohortes')}"></a>

    <div th:replace="~{fragments/sidebar :: grupo('Inscripciones')}"></div>
    <a th:replace="~{fragments/sidebar :: enlace('/descuento/buscar', 'fa-percent', 'Descuentos', ${activo}, 'descuentos')}"></a>
    <a th:replace="~{fragments/sidebar :: enlace('/inscripcion/buscar', 'fa-user-graduate', 'Inscripciones', ${activo}, 'inscripciones')}"></a>
    <a th:replace="~{fragments/sidebar :: enlace('/pago/buscar', 'fa-credit-card', 'Pagos', ${activo}, 'pagos')}"></a>
</th:block>

<!-- ========== Gestión académica (MOD-F-02), para el alumno y el docente ==========
     urlBase: ruta del curso abierto ('/inscripcion/acceder/{id}' o '/curso/acceder/{id}'). La navegación se organiza según la jerarquía
     Curso → Programa → Cohorte → Tema; los enlaces con '#' no tienen acción por ahora. -->
<th:block th:fragment="gestionAcademica(activo, urlBase)">
    <th:block th:replace="~{fragments/sidebar :: marco(~{fragments/menus :: enlacesGestionAcademica(${activo}, ${urlBase})})}"></th:block>
</th:block>

<th:block th:fragment="enlacesGestionAcademica(activo, urlBase)">
    <a th:replace="~{fragments/sidebar :: enlace(${urlBase}, 'fa-house', ${curso != null ? #strings.abbreviate(curso.nombre, 22) : 'Curso'}, ${activo}, 'curso')}"></a>

    <!-- Docente y administrador: tres grupos (Plan de estudios, Contenido y Dictado) que se despliegan al tocar su título; el primer
         ítem de cada uno es la entidad (Programas, Temas, Cohortes). Al docente el menú se le habilita de a poco, según el paso del
         diseño en que está su cohorte (nivelMenu): Programas desde el paso 2, Temas desde el 3, Cronogramas desde el 4 y todo el
         contenido de los temas desde el 5. Lo de la cohorte (participantes, progreso, intentos y calificaciones) se habilita cuando
         deja de estar pendiente. Lo que todavía no corresponde no se muestra. -->
    <th:block th:if="${esDocente == true or esAdministrador == true}"
              th:with="nivel=${nivelMenu != null ? nivelMenu : 5}, pendiente=${cohortePendiente != null and cohortePendiente}, guia=${nivelMenu != null}">
        <th:block th:if="${nivel >= 2}">
            <div th:replace="~{fragments/sidebar :: grupo('Plan de estudios')}"></div>
            <a th:replace="~{fragments/sidebar :: enlaceGuia('/programa/buscar?cursoId=' + ${curso.idCurso}, 'Programas', ${activo}, 'programas', true, ${guia and nivel == 2})}"></a>
            <th:block th:if="${nivel >= 4}">
                <a th:replace="~{fragments/sidebar :: enlaceGuia('/cronograma/buscar?cursoId=' + ${curso.idCurso}, 'Cronogramas', ${activo}, 'cronograma', false, ${guia and nivel == 4})}"></a>
            </th:block>
        </th:block>

        <th:block th:if="${nivel >= 3}">
            <div th:replace="~{fragments/sidebar :: grupo('Contenido')}"></div>
            <a th:replace="~{fragments/sidebar :: enlaceGuia('/tema/buscar?cursoId=' + ${curso.idCurso}, 'Temas', ${activo}, 'temas', true, ${guia and nivel == 3})}"></a>
            <th:block th:if="${nivel >= 5}">
                <!-- Las clases en vivo solo existen en los cursos con esa modalidad -->
                <th:block th:if="${curso.incluyeModalidad('En vivo')}">
                    <a th:replace="~{fragments/sidebar :: enlaceGuia(${urlBase} + '?seccion=clases', 'Clases en vivo', ${activo}, 'clases', false, ${guia and nivel == 5})}"></a>
                </th:block>
                <a th:replace="~{fragments/sidebar :: enlaceGuia('/material/buscar?cursoId=' + ${curso.idCurso}, 'Recursos', ${activo}, 'materiales', false, ${guia and nivel == 5})}"></a>
                <a th:replace="~{fragments/sidebar :: enlaceGuia('/pool/buscar?cursoId=' + ${curso.idCurso}, 'Pools', ${activo}, 'pools', false, ${guia and nivel == 5})}"></a>
                <a th:replace="~{fragments/sidebar :: enlaceGuia('/autoevaluacion/buscar?cursoId=' + ${curso.idCurso}, 'Autoevaluaciones', ${activo}, 'autoevaluaciones', false, ${guia and nivel == 5})}"></a>
                <a th:replace="~{fragments/sidebar :: enlaceGuia('/glosario/buscar?cursoId=' + ${curso.idCurso}, 'Glosario', ${activo}, 'glosario', false, ${guia and nivel == 5})}"></a>
                <a th:replace="~{fragments/sidebar :: enlaceGuia('/foro/buscar?cursoId=' + ${curso.idCurso}, 'Foros', ${activo}, 'foros', false, ${guia and nivel == 5})}"></a>
            </th:block>
        </th:block>

        <div th:replace="~{fragments/sidebar :: grupo('Dictado')}"></div>
        <a th:replace="~{fragments/sidebar :: enlaceGuia('/cohorte/buscar?cursoId=' + ${curso.idCurso}, 'Cohortes', ${activo}, 'cohortes', true, false)}"></a>
        <th:block th:if="${!pendiente}">
            <a th:replace="~{fragments/sidebar :: enlaceGuia('/participante/buscar?cursoId=' + ${curso.idCurso}, 'Participantes', ${activo}, 'docentes', false, false)}"></a>
            <a th:replace="~{fragments/sidebar :: enlaceGuia('/progreso/buscar?cursoId=' + ${curso.idCurso}, 'Progresos', ${activo}, 'progreso', false, false)}"></a>
            <a th:replace="~{fragments/sidebar :: enlaceGuia('/intento/buscar?cursoId=' + ${curso.idCurso}, 'Intentos', ${activo}, 'intentos', false, false)}"></a>
            <a th:replace="~{fragments/sidebar :: enlaceGuia('/calificacion/buscar?cursoId=' + ${curso.idCurso}, 'Calificaciones', ${activo}, 'calificaciones', false, false)}"></a>
        </th:block>
    </th:block>

    <!-- Alumno: el cronograma del programa en el que está inscripto, su cohorte y las autoevaluaciones -->
    <th:block th:unless="${esDocente == true or esAdministrador == true}">
        <div th:replace="~{fragments/sidebar :: grupo('Este programa')}"></div>
        <a th:replace="~{fragments/sidebar :: enlace(${urlBase} + '?seccion=cronograma', 'fa-calendar-check', 'Cronograma', ${activo}, 'cronograma')}"></a>

        <div th:replace="~{fragments/sidebar :: grupo('Esta cohorte')}"></div>
        <th:block th:if="${curso == null or curso.incluyeModalidad('En vivo')}">
            <a th:replace="~{fragments/sidebar :: enlace(${urlBase} + '?seccion=clases', 'fa-video', 'Clases en vivo', ${activo}, 'clases')}"></a>
        </th:block>
        <a th:replace="~{fragments/sidebar :: enlace(${#strings.replace(urlBase, '/inscripcion/acceder/', '/participante/ver/')}, 'fa-users', 'Participantes', ${activo}, 'docentes')}"></a>
        <a th:replace="~{fragments/sidebar :: enlace(${#strings.replace(urlBase, '/inscripcion/acceder/', '/calificacion/ver/')}, 'fa-star', 'Calificaciones', ${activo}, 'calificaciones')}"></a>

        <div th:replace="~{fragments/sidebar :: grupo('Contenido de los temas')}"></div>
        <a th:replace="~{fragments/sidebar :: enlace('#', 'fa-clipboard-check', 'Autoevaluaciones', ${activo}, 'autoevaluaciones')}"></a>
    </th:block>
</th:block>
