<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<body>
    <!-- Pestañas del curso, debajo del título y subtítulo (como en Moodle). Son los mismos enlaces del menú lateral;
         los que todavía no tienen acción ('#') quedan visibles sin enlace. El docente suma un menú "Más" con el resto.
         urlBase: ruta del curso abierto; curso: el curso; esDocente: define qué pestañas y enlaces corresponden. -->
    <th:block th:fragment="pestanias(urlBase, curso, esDocente)">
        <nav class="ac-curso-pestanias" aria-label="Secciones del curso">
            <a class="ac-pestania activa" th:href="@{${urlBase}}" aria-current="page">Curso</a>

            <!-- Docente y administrador: los mismos grupos, nombres y habilitación progresiva que el menú lateral. Cada pestaña se
                 despliega con la entidad primero (en negrita) y debajo sus secciones. -->
            <th:block th:if="${esDocente == true or esAdministrador == true}"
                      th:with="nivel=${nivelMenu != null ? nivelMenu : 5}, pendiente=${cohortePendiente != null and cohortePendiente}">

                <div class="ac-pestania-mas" th:if="${nivel >= 2}">
                    <button type="button" class="ac-pestania" data-pestanias-mas aria-expanded="false" aria-haspopup="true">
                        Plan de estudios <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="ac-pestanias-menu" data-pestanias-menu hidden>
                        <a th:href="${'/programa/buscar?cursoId=' + curso.idCurso}"><strong>Programas</strong></a>
                        <a th:href="${'/cronograma/buscar?cursoId=' + curso.idCurso}" th:if="${nivel >= 4}">Cronogramas</a>
                    </div>
                </div>

                <div class="ac-pestania-mas" th:if="${nivel >= 3}">
                    <button type="button" class="ac-pestania" data-pestanias-mas aria-expanded="false" aria-haspopup="true">
                        Contenido <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="ac-pestanias-menu" data-pestanias-menu hidden>
                        <a th:href="${'/tema/buscar?cursoId=' + curso.idCurso}"><strong>Temas</strong></a>
                        <th:block th:if="${nivel >= 5}">
                            <a th:href="${urlBase + '?seccion=clases'}" th:if="${curso.incluyeModalidad('En vivo')}">Clases en vivo</a>
                            <a th:href="${'/material/buscar?cursoId=' + curso.idCurso}">Recursos</a>
                            <a th:href="${'/pool/buscar?cursoId=' + curso.idCurso}">Pools</a>
                            <a th:href="${'/autoevaluacion/buscar?cursoId=' + curso.idCurso}">Autoevaluaciones</a>
                            <a th:href="${'/glosario/buscar?cursoId=' + curso.idCurso}">Glosario</a>
                            <a th:href="${'/foro/buscar?cursoId=' + curso.idCurso}">Foros</a>
                        </th:block>
                    </div>
                </div>

                <div class="ac-pestania-mas">
                    <button type="button" class="ac-pestania" data-pestanias-mas aria-expanded="false" aria-haspopup="true">
                        Dictado <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="ac-pestanias-menu" data-pestanias-menu hidden>
                        <a th:href="${'/cohorte/buscar?cursoId=' + curso.idCurso}"><strong>Cohortes</strong></a>
                        <th:block th:if="${!pendiente}">
                            <a th:href="${'/participante/buscar?cursoId=' + curso.idCurso}">Participantes</a>
                            <a th:href="${'/progreso/buscar?cursoId=' + curso.idCurso}">Progresos</a>
                            <a th:href="${'/intento/buscar?cursoId=' + curso.idCurso}">Intentos</a>
                            <a th:href="${'/calificacion/buscar?cursoId=' + curso.idCurso}">Calificaciones</a>
                        </th:block>
                    </div>
                </div>
            </th:block>

            <!-- Alumno -->
            <th:block th:unless="${esDocente == true or esAdministrador == true}">
                <a class="ac-pestania" th:href="${urlBase + '?seccion=cronograma'}">Cronograma</a>
                <a class="ac-pestania" th:href="${urlBase + '?seccion=clases'}" th:if="${curso.incluyeModalidad('En vivo')}">Clases en vivo</a>
                <a class="ac-pestania" th:href="${#strings.replace(urlBase, '/inscripcion/acceder/', '/participante/ver/')}">Participantes</a>
                <a class="ac-pestania" th:href="${#strings.replace(urlBase, '/inscripcion/acceder/', '/calificacion/ver/')}">Calificaciones</a>
                <a class="ac-pestania" href="#" data-sin-accion>Autoevaluaciones</a>
            </th:block>
        </nav>
    </th:block>
</body>

</html>
