<!-- Barra superior del panel con el menú del usuario.
     navegacion: fragmento con los enlaces del módulo para el lado izquierdo (null si no hay) -->
<header class="pn-barra" th:fragment="barra(navegacion)">
    <button type="button" class="pn-barra-menu" data-abrir-menu aria-label="Abrir menú"><i class="fa-solid fa-bars"></i></button>
    <th:block th:if="${navegacion != null}">
        <nav class="pn-barra-nav" th:insert="${navegacion}"></nav>
    </th:block>
    <span th:if="${navegacion == null}"></span>
    <th:block th:replace="~{fragments/menuUsuario :: menu('panel')}"></th:block>
</header>

<!-- Pie del panel. modulo: nombre del módulo que se muestra junto a la marca -->
<footer class="pn-pie" th:fragment="pie(modulo)">
    <span><strong>Idóneos Online</strong> — <th:block th:text="${modulo}">Panel del administrador</th:block></span>
    <span>Desarrollado por Küster y Martinez</span>
</footer>

<!-- Scripts comunes de las páginas del panel -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/formularios.js}"></script>
    <script th:src="@{/js/panel.js}"></script>
    <script th:if="${mensaje != null and !#strings.isEmpty(mensaje)}" th:inline="javascript">
        mostrarExito(/*[[${mensaje}]]*/ '');
    </script>
    <script th:if="${error != null and !#strings.isEmpty(error)}" th:inline="javascript">
        mostrarError(/*[[${error}]]*/ '');
    </script>
</th:block>
