<!-- Barra lateral reutilizable de los módulos con diseño de panel (administración, gestión académica, etc.).
     Cada módulo arma su menú en fragments/menus.html y lo pasa al marco como parámetro. -->

<!-- Marco de la barra lateral: lugar para la navegación del módulo y pie. Empieza debajo del navbar, que lleva la
     marca y el botón para contraerla.
     navegacion: fragmento con los enlaces del módulo (se arma con 'enlace' y 'grupo'). -->
<th:block th:fragment="marco(navegacion)">
    <aside class="pn-menu" aria-label="Menú lateral">
        <nav class="pn-menu-nav" th:insert="${navegacion}"></nav>
        <div class="pn-menu-pie">© 2026 Idóneos Online</div>
    </aside>
    <div class="pn-fondo-menu" data-cerrar-menu></div>
    <!-- Arma los grupos del menú ahora, antes del primer dibujo (si esperara al final de la página se vería sin agrupar) -->
    <script th:src="@{/js/menuLateral.js}"></script>
</th:block>

<!-- Enlace del menú. url: ruta de la aplicación ('#' = sin acción por ahora); icono: clase de FontAwesome;
     activo: clave de la página actual; clave: clave de este enlace (se marca como activo si coinciden). -->
<a th:fragment="enlace(url, icono, texto, activo, clave)" th:href="${url == '#' ? '#' : url}" class="pn-menu-enlace"
   th:classappend="${activo == clave} ? 'activo'" th:attr="data-sin-accion=${url == '#'} ? '' : null"
   th:title="${texto}">
    <span th:text="${texto}">Enlace</span>
</a>

<!-- Enlace del menú con un indicador de estado a la derecha: estado 'ok' (verde, está completo) o 'pendiente' (naranja, falta
     algo); sin estado, no lleva indicador. -->
<a th:fragment="enlaceEstado(url, icono, texto, activo, clave, estado)" th:href="${url}" class="pn-menu-enlace"
   th:classappend="${activo == clave} ? 'activo'" th:title="${texto}">
    <span th:text="${texto}">Enlace</span><span class="pn-menu-estado" th:if="${estado != null}"
        th:classappend="${estado}" th:title="${estado == 'ok' ? 'Completo' : 'Falta completar'}"></span>
</a>

<!-- Enlace del menú del curso para quien lo gestiona: la entidad de cada grupo (Programas, Temas, Cohortes) va en negrita y lo
     que se acaba de habilitar con el paso actual del diseño lleva un punto. -->
<a th:fragment="enlaceGuia(url, texto, activo, clave, entidad, nuevo)" th:href="${url}" class="pn-menu-enlace"
   th:classappend="${activo == clave} ? 'activo'" th:data-entidad="${entidad} ? 'true' : null" th:data-nuevo="${nuevo} ? 'true' : null"
   th:title="${texto}">
    <span th:text="${texto}">Enlace</span>
</a>

<!-- Grupo cuyo título es un enlace (lleva al ABM de esa sección) y a la vez abre y cierra los enlaces que le siguen. -->
<div th:fragment="grupoEnlace(url, texto, activo, clave)" class="pn-menu-grupo" th:classappend="${activo == clave} ? 'activo'"
     th:title="${texto}" role="button" tabindex="0" aria-expanded="true" data-grupo-menu>
    <a th:href="${url}" class="pn-menu-grupo-enlace" th:text="${texto}">Grupo</a><i class="fa-solid fa-chevron-down pn-menu-grupo-flecha" aria-hidden="true"></i>
</div>

<!-- Título de un grupo de enlaces del menú. Es desplegable: al hacerle clic se ocultan o se muestran los enlaces que le siguen
     hasta el próximo grupo (lo arma static/js/panel.js). -->
<div th:fragment="grupo(texto)" class="pn-menu-grupo" th:title="${texto}" role="button" tabindex="0" aria-expanded="true" data-grupo-menu>
    <span th:text="${texto}">Grupo</span><i class="fa-solid fa-chevron-down pn-menu-grupo-flecha" aria-hidden="true"></i>
</div>
