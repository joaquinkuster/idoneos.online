<!-- Cabecera del cuestionario (modo foco: sin menú lateral). Parámetros: curso, autoevaluacion y segundos (los que le quedan al
     intento según el servidor, o null si no tiene tiempo límite). El navbar reducido lleva el logo, el reloj (que dibuja
     static/js/intento.js) y el menú con "Cerrar sesión", que está permitido: no termina el intento, el tiempo sigue corriendo y
     al volver a ingresar se retoma el cuestionario. Debajo del navbar va el título de la autoevaluación. -->
<th:block th:fragment="cabecera(curso, autoevaluacion, segundos)">
<th:block th:replace="~{fragments/navbarIntento :: navbar(${segundos})}"></th:block>
<div class="in-titulo-intento">
    <span class="in-cabecera-curso" th:text="${curso.nombre + ' · ' + autoevaluacion.tema.titulo}">Curso · Tema</span>
    <h1 class="in-titulo-intento-nombre" th:text="${autoevaluacion.nombre}">Autoevaluación</h1>
</div>
</th:block>
