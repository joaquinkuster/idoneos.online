<!-- Tarjeta de un curso del catálogo. Se usa en el catálogo y en el inicio.
     Parámetros: c (el curso) y unidades (cantidad de unidades temáticas, puede ser nulo).
     La imagen lleva un degradé de uno de tres tonos (azul, ámbar o verde, según el curso); sin imagen, el degradé es el fondo. -->
<div th:fragment="tarjeta(c, unidades)" class="cc-carta" data-tarjeta
     th:with="cantidad=${unidades != null ? unidades : 0}"
     th:data-f-busqueda="${c.nombre + ' ' + (c.descripcion != null ? c.descripcion : '')}"
     th:data-f-categoriaid="${c.categoria.idCategoria}" th:data-f-nivelid="${c.nivel.idNivel}"
     th:data-f-docenteid="${#strings.listJoin(c.equipoDocente.![docente.idDocente], '|')}"
     th:data-f-modalidadid="${#strings.listJoin(c.modalidades.![idModalidad], '|')}">
  <div class="cc-imagen" th:classappend="${'cc-tono-' + (c.idCurso % 3)}">
    <img th:if="${c.imagen != null}" th:src="@{${c.urlImagen}}" alt="" width="640" height="300" loading="lazy" decoding="async">
    <span class="cc-velo" th:if="${c.imagen != null}"></span>
    <span class="cc-estado">Inscripción abierta</span>
  </div>
  <div class="cc-cuerpo">
    <span class="cc-etiqueta" th:text="${c.categoria.nombre + ' · ' + c.nivel.nombre}">Categoría · Nivel</span>
    <h4 class="cc-titulo" th:text="${c.nombre}">Nombre del curso</h4>
    <p class="cc-descripcion" th:text="${c.descripcion}">Descripción</p>
    <div class="cc-datos">
      <div>
        <small>Modalidad</small>
        <span><span th:each="m, st : ${c.modalidades}"><span th:text="${m.nombre}">Grabada</span><span th:if="${!st.last}">, </span></span></span>
      </div>
      <div>
        <small>Contenido</small>
        <span th:text="${cantidad + (cantidad == 1 ? ' unidad' : ' unidades')}">3 unidades</span>
      </div>
    </div>
    <div class="cc-pie">
      <div class="cc-docente">
        <small>Docente</small>
        <span th:text="${c.docenteTitular != null and c.docenteTitular.usuario != null ? c.docenteTitular.usuario.nombreCompleto : 'Equipo Académico'}">Docente</span>
      </div>
      <span class="cc-precio"
            th:text="${c.precio != null && c.precio <= 0 ? 'Gratis' : '$ ' + #numbers.formatDecimal(c.precio != null ? c.precio : 0, 1, 'POINT', 0, 'COMMA')}">$ 0</span>
    </div>
    <a th:href="@{'/catalogo/ficha/' + ${c.idCurso}}" class="cc-boton">Ver ficha del curso</a>
  </div>
</div>
