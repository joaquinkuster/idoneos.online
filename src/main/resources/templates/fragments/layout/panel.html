<!-- Barra superior del panel: es el navbar único del sitio (fragments/layout/navbar). -->
<th:block th:fragment="barra(navegacion)">
    <th:block th:replace="~{fragments/layout/navbar :: navbar}"></th:block>
</th:block>

<!-- Pie del panel. modulo: nombre del módulo que se muestra junto a la marca -->
<footer class="pn-pie" th:fragment="pie(modulo)">
    <span><strong>Idóneos Online</strong> - <th:block th:text="${modulo}">Panel del administrador</th:block></span>
    <span>Desarrollado por Küster y Martinez</span>
</footer>

<!-- Scripts comunes de las páginas del panel -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/core/formulario.js}"></script>
    <script th:src="@{/js/core/validacion.js}"></script>

    <script th:src="@{/js/core/tabla.js}"></script>
    <script th:src="@{/js/core/textoLargo.js}"></script>

    <script th:src="@{/js/core/panel.js}"></script>
    <script th:src="@{/js/core/modalBaja.js}"></script>
    <script th:src="@{/js/components/tiempo.js}"></script>
    <script th:src="@{/js/components/duracion.js}"></script>
    <script th:src="@{/js/components/selectBuscable.js}"></script>
    <script th:src="@{/js/core/hojaDeRuta.js}"></script>
    <!-- Los avisos del servidor (mensaje y error) ya los muestra el navbar: acá no se repiten -->
</th:block>
