<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<body>
    <!-- Pestañas del curso, debajo del título y subtítulo (como en Moodle). -->
    <th:block th:fragment="navbar(urlBase, curso, esDocente)">
        <nav class="ac-curso-navbar" aria-label="Secciones del curso">
            <a class="ac-navbar-item" th:classappend="${seccion == 'temas'} ? 'activa'" th:href="@{${urlBase}}" th:attr="aria-current=${seccion == 'temas'} ? 'page' : null">Curso</a>

            <!-- Docente y administrador: los mismos grupos, nombres y habilitación progresiva que el menú lateral. -->
            <th:block th:if="${esDocente == true or esAdministrador == true}"
                      th:with="nivel=${nivelMenu != null ? nivelMenu : 5}, pendiente=${cohortePendiente != null and cohortePendiente}">

                <div class="ac-navbar-item-mas" th:if="${nivel >= 2}">
                    <button type="button" class="ac-navbar-item" th:classappend="${menuActivo == 'cronograma'} ? 'activa'" data-navbar-mas aria-expanded="false" aria-haspopup="true">
                        Plan de estudios <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="ac-navbar-menu" data-navbar-menu hidden>
                        <a th:href="${'/tema/buscar?cursoId=' + curso.idCurso}"><strong>Temas</strong></a>
                        <a th:href="${'/programa/buscar?cursoId=' + curso.idCurso}" th:if="${nivel >= 3}">Programas</a>
                        <a th:href="${'/cronograma/buscar?cursoId=' + curso.idCurso}" th:if="${nivel >= 4}">Cronogramas</a>
                    </div>
                </div>

                <div class="ac-navbar-item-mas" th:if="${nivel >= 2}">
                    <button type="button" class="ac-navbar-item" data-navbar-mas aria-expanded="false" aria-haspopup="true">
                        Contenido <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="ac-navbar-menu" data-navbar-menu hidden>
                        <a th:href="${'/recurso/buscar?cursoId=' + curso.idCurso}"><strong>Recursos</strong></a>
                        <a th:href="${'/pool/buscar?cursoId=' + curso.idCurso}">Pools</a>
                        <a th:href="${'/autoevaluacion/buscar?cursoId=' + curso.idCurso}">Autoevaluaciones</a>
                        <a th:href="${'/glosario/buscar?cursoId=' + curso.idCurso}">Glosario</a>
                        <a th:href="${'/foro/buscar?cursoId=' + curso.idCurso}">Foros</a>
                        <a th:href="${'/claseEnVivo/buscar?cursoId=' + curso.idCurso}" th:if="${curso.incluyeModalidad('En vivo')}">Clases en vivo</a>
                    </div>
                </div>

                <div class="ac-navbar-item-mas">
                    <button type="button" class="ac-navbar-item" data-navbar-mas aria-expanded="false" aria-haspopup="true">
                        Dictado <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="ac-navbar-menu" data-navbar-menu hidden>
                        <a th:href="${'/cohorte/buscar?cursoId=' + curso.idCurso}"><strong>Cohortes</strong></a>
                        <th:block th:if="${!pendiente}">
                            <a th:href="${'/participante/buscar?cursoId=' + curso.idCurso}">Participantes</a>
                            <a th:href="${'/progreso/buscar?cursoId=' + curso.idCurso}">Progresos</a>
                            <a th:href="${'/intento/buscar?cursoId=' + curso.idCurso}">Intentos</a>
                            <a th:href="${'/intento/buscarPorAutoevaluacion?cursoId=' + curso.idCurso}">Calificaciones</a>
                        </th:block>
                    </div>
                </div>
            </th:block>

            <!-- Alumno: los mismos grupos que el docente, solo con lo que el alumno puede ver -->
            <th:block th:unless="${esDocente == true or esAdministrador == true}">
                <div class="ac-navbar-item-mas">
                    <button type="button" class="ac-navbar-item" data-navbar-mas aria-expanded="false" aria-haspopup="true">
                        Plan de estudios <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="ac-navbar-menu" data-navbar-menu hidden>
                        <a th:href="${urlBase + '?seccion=cronograma'}"><strong>Cronograma</strong></a>
                    </div>
                </div>

                <div class="ac-navbar-item-mas">
                    <button type="button" class="ac-navbar-item" data-navbar-mas aria-expanded="false" aria-haspopup="true">
                        Dictado <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="ac-navbar-menu" data-navbar-menu hidden>
                        <a th:href="${#strings.replace(urlBase, '/inscripcion/acceder/', '/participante/ver/')}"><strong>Participantes</strong></a>
                        <a th:href="${#strings.replace(urlBase, '/inscripcion/acceder/', '/intento/buscarPorInscripcion/')}">Calificaciones</a>
                    </div>
                </div>
            </th:block>
        </nav>
    </th:block>
</body>

</html>
