<!-- Menú desplegable del usuario autenticado (el mismo en todo el sitio, dentro del navbar único). -->
<div th:fragment="menu" class="um-wrapper" th:if="${usuario != null}">
    <button type="button" class="um-trigger" data-menu-usuario aria-haspopup="true" aria-expanded="false">
        <th:block th:replace="~{fragments/components/avatar :: avatar(${usuario}, 'av-menu')}"></th:block>
        <span class="um-datos">
            <span class="um-nombre" th:text="${usuario.nombreCompleto}">Admin General</span>
            <span class="um-rol" th:text="${usuario.rolActivo != null ? usuario.rolActivo.nombre : 'Usuario'}">Administrador</span>
        </span>
        <i class="fa-solid fa-chevron-down um-flecha"></i>
    </button>

    <div class="um-dropdown" role="menu">
        <div class="um-encabezado">
            <div class="um-encabezado-nombre" th:text="${usuario.nombreCompleto}">Admin General</div>
            <div class="um-encabezado-correo" th:text="${usuario.correo}">admin@idoneos.online</div>
        </div>

        <div class="um-seccion">
            <!-- "Mi portal": un acordeón igual para los tres roles. -->
            <div th:if="${usuario.esAdministradorActivo() or usuario.esDocenteActivo() or usuario.esAlumnoActivo()}" class="um-grupo">
                <button type="button" class="um-item um-grupo-cabecera" data-um-desplegar aria-expanded="false">
                    <span>Mi portal</span><i class="fa-solid fa-chevron-down"></i>
                </button>
                <div class="um-submenu">
                    <div class="um-submenu-interior">
                        <!-- Administrador -->
                        <a th:if="${usuario.esAdministradorActivo()}" th:href="@{/curso/buscar}" class="um-item um-item-sub">Panel administrador</a>
                        <a th:if="${usuario.esAdministradorActivo()}" th:href="@{/curso/buscar?vista=cards}" class="um-item um-item-sub">Cursos</a>
                        <a th:if="${usuario.esAdministradorActivo()}" th:href="@{/biblioteca/buscar}" class="um-item um-item-sub">Biblioteca digital</a>

                        <!-- Docente -->
                        <a th:if="${usuario.esDocenteActivo()}" th:href="@{/curso/buscar}" class="um-item um-item-sub">Mis cursos</a>
                        <a th:if="${usuario.esDocenteActivo()}" th:href="@{/biblioteca/buscar}" class="um-item um-item-sub">Biblioteca digital</a>

                        <!-- Alumno -->
                        <a th:if="${usuario.esAlumnoActivo()}" th:href="@{/inscripcion/buscar}" class="um-item um-item-sub">Mis cursos</a>
                        <a th:if="${usuario.esAlumnoActivo()}" th:href="@{/pago/buscar}" class="um-item um-item-sub">Mis pagos</a>
                        <a th:if="${usuario.esAlumnoActivo()}" th:href="@{/certificado/buscar}" class="um-item um-item-sub">Mis certificados</a>
                        <button type="button" th:if="${usuario.esAlumnoActivo()}" class="um-item um-item-sub" data-abrir-intereses>Mis intereses</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="um-seccion">
            <label class="um-etiqueta" for="selectRolPorDefecto">Rol por defecto</label>
            <select id="selectRolPorDefecto" class="um-select" data-selector-rol th:disabled="${#lists.size(usuario.rolesVigentes) < 2}">
                <option th:each="rol : ${usuario.rolesVigentes}" th:value="${rol.idRol}" th:text="${rol.nombre}"
                        th:selected="${usuario.rolActivo != null and usuario.rolActivo.idRol == rol.idRol}">Administrador</option>
            </select>
        </div>

        <div class="um-seccion">
            <button type="button" class="um-item um-item-peligro" onclick="confirmarCerrarSesion()">Cerrar sesión</button>
            <form id="formularioCerrarSesion" th:action="@{/logout}" method="post" class="d-none"></form>
        </div>
    </div>
    <th:block th:replace="~{pages/intereses/formulario :: bloque}"></th:block>
    <th:block th:replace="~{fragments/components/asistente :: bloque}"></th:block>
</div>
