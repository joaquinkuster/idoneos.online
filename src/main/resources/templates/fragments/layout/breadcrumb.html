<!-- Ruta de navegación de las vistas del panel del administrador, igual que la del panel del curso. grupo: grupo del menú lateral (opcional). Actual. -->
<nav th:fragment="panel(grupo, actual)" class="ac-migas" aria-label="Ruta de navegación">
    <a th:href="@{/inicio}">Página principal</a>
    <i class="fa-solid fa-chevron-right"></i>
    <th:block th:if="${grupo != null}">
        <span th:text="${grupo}">Grupo</span>
        <i class="fa-solid fa-chevron-right"></i>
    </th:block>
    <strong th:text="${actual}">Vista</strong>
</nav>

<!-- Ruta de navegación (breadcrumb), debajo del banner. padre/urlPadre: nivel intermedio opcional. Actual. -->
<div th:fragment="migas(padre, urlPadre, actual)" class="wf-migas-barra">
    <nav class="wf-migas" aria-label="Ruta de navegación">
        <a th:href="@{/inicio}">Inicio</a>
        <span class="wf-migas-separador">›</span>
        <th:block th:if="${padre != null}">
            <a th:href="@{${urlPadre}}" th:text="${padre}">Catálogo</a>
            <span class="wf-migas-separador">›</span>
        </th:block>
        <span class="wf-migas-actual" th:text="${actual}">Página</span>
    </nav>
</div>
