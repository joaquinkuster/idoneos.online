# Configuración de pruebas: base de datos H2 en memoria (no toca la base PostgreSQL de desarrollo)
spring.application.name=idoneos

spring.datasource.url=jdbc:h2:mem:idoneos_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Sin servidor de correo en las pruebas
spring.mail.host=localhost
spring.mail.port=2525
