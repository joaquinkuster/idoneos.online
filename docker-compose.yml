name: idoneos

services:
  base:
    image: postgres:16.4
    container_name: idoneos-bd
    environment:
      POSTGRES_DB: idoneos.online
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - bd:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d idoneos.online"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: idoneos
    container_name: idoneos
    depends_on:
      base:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://base:5432/idoneos.online
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # create recrea las tablas y la semilla en cada arranque; para conservar los datos: none y IDONEOS_SEMILLA "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: create
      IDONEOS_SEMILLA: "true"
      IDONEOS_DIRECTORIO_CURSOS: /app/uploads
    volumes:
      - archivos:/app/uploads

volumes:
  bd:
    name: idoneos-bd
  archivos:
    name: idoneos-archivos

networks:
  default:
    name: idoneos-red
